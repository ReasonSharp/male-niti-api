openapi: 3.0.3
info:
  title: A-To-Do API
  description: >-
    Backend API for the A-To-Do to-do list application. Implementing this
    spec turns the app from a single-browser, localStorage-only prototype
    into a real multi-tenant service: every endpoint below is scoped to the
    authenticated account (via its bearer token), so two people logging into
    two different accounts genuinely see two different task lists, rather
    than the one shared list the pre-backend prototype used.

    All endpoints are prefixed with `/atodo/v1`. The bearer token is an
    opaque, server-issued credential (a real signed JWT is the intended
    implementation) that embeds at least `sub` (the account id) and the
    account's current `subscription` claim, so the client can read
    subscription status without an extra round trip -- see the `Token`
    schema. Whenever an endpoint changes something the token's claims
    reflect (starting/cancelling/scheduling deletion of a subscription), it
    returns a freshly issued token in place of the old one; the client is
    expected to discard the old one immediately.

    The to-do list's rules (recurrence, overdue/failed, carried-over and
    recur-until-completed chains, timers, the free plan's limits) run here,
    not in the client. The client reads what it shows -- one local day of a
    list at a time (`GET /days`), the agenda, one task, Manage Tasks, stats
    -- and changes things through one action endpoint per change (complete
    an occurrence, edit a task's details, change its pattern, pause it,
    ...), each answering with what changed (`ActionResult`). Every such
    request first brings the account up to date (timers that ran out,
    missed occurrences), so a read can change stored state too; requests
    for one account are serialized.

    Time zones: every request carries the user's zone (`X-Timezone`), and
    every date and time the client sends or gets is the user's local one --
    except where a task fixed to another zone shows its own time
    (`Item.zoneDueTime`) and the occurrence dates actions address it by.

    Every error response uses the same `Error` schema (`{ code, message }`).
    `code` is a stable, machine-readable identifier the client branches on
    (e.g. to show a specific translated message); `message` is a
    human-readable fallback, not meant to be shown as-is in a finished UI.
  version: "2.0.0"
externalDocs:
  description: Client-side implementation notes
  url: ./CLAUDE.md

servers:
  - url: "{baseUrl}/atodo/v1"
    variables:
      baseUrl:
        default: http://localhost:4000
        description: >-
          The API_BASE_URL configured for the client (see .env/config.js and
          CLAUDE.md's Configuration section) -- this server entry's `{baseUrl}`
          is that value, unprefixed; every path below already includes the
          /atodo/v1 prefix via this server URL, not repeated on each path.

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Registration, email verification, login, and the current session.
  - name: Users
    description: The authenticated account's own profile, preferences, and deletion.
  - name: Lists
    description: The to-do list a day at a time, the agenda, focus, Manage Tasks, stats and the export.
  - name: Tasks
    description: One task -- its details, and an action endpoint per change to it or one of its occurrences.
  - name: Imports
    description: Data imports, uploaded in chunks.
  - name: Subscriptions
    description: Trial/paid subscription lifecycle, including the Stripe checkout handoff.
  - name: Support
    description: Messages to support, from the client's support page.
  - name: Translations
    description: The client's interface texts and the languages they're in.

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new (unverified) account
      description: >-
        Creates a pending registration and emails a verification link to
        `email` (server-side email delivery; the client never sees the
        token). Registering again with an email that already has a pending
        (not yet verified) registration re-sends a fresh link rather than
        erroring, since the first one may have gone missing or expired.
        Never reveals whether an email is already a *verified* account
        (that's `EMAIL_TAKEN`) vs. never registered at all -- see `login`'s
        own description for the same principle. `checkoutPlan` (from the
        landing page's pricing buttons) makes the emailed link carry
        `next=checkout&plan=<plan>` too, so verifying continues to checkout
        for that plan; any other value is ignored.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
                checkoutPlan:
                  type: string
                  enum: [monthly, annual]
      responses:
        "202":
          description: Verification email sent (or re-sent).
        "400":
          description: Malformed email or a password under 8 characters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: INVALID_EMAIL, message: "Enter a valid email address." }
        "409":
          description: A verified account already exists with this email.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: EMAIL_TAKEN, message: "An account with that email already exists." }

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Consume an email verification link's token
      description: >-
        Promotes a pending registration to a real account and logs it in
        (`token`/`user`, as POST /auth/login returns them -- the link proves
        the email, the password was just chosen), so the client goes
        straight into the app, or on to checkout when the link carries
        `next=checkout`. Only when this created the account: an email that
        was already an account meanwhile gets just `email`. Single-use: the token is consumed as soon as it's looked up here,
        whether or not it was still within its validity window, so
        revisiting the same link a second time always reports
        `INVALID_TOKEN` rather than re-verifying or re-expiring.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Verified.
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: string, format: email }
                  token: { type: string, description: "A session for the new account (absent if it already existed)." }
                  user: { $ref: "#/components/schemas/User" }
        "400":
          description: The token doesn't match any pending registration (already used, or never existed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: INVALID_TOKEN, message: "That verification link is invalid or has already been used." }
        "410":
          description: The token matched a pending registration, but its validity window (6 hours) has passed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: EXPIRED, message: "That verification link has expired. Please register again." }

  /auth/verify-email-change:
    post:
      tags: [Auth]
      summary: Consume a login-email change's verification link
      description: >-
        The link emailed to the NEW address by `POST /users/me/change-email`
        (valid 6 hours, same as registration's). Makes the new address the
        account's login email immediately; the old one stops working for
        login. Single-use, like `/auth/verify-email`. Doesn't end any
        session -- the bearer token doesn't embed the email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Verified -- `email` is now the login email.
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: string, format: email }
        "400":
          description: The token doesn't match any pending change (already used, cancelled by a newer change or an undo, or never existed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: INVALID_TOKEN, message: "That verification link is invalid or has already been used." }
        "409":
          description: Another account has taken that address in the meantime -- the pending change is cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: EMAIL_TAKEN, message: "An account with that email already exists." }
        "410":
          description: The 6-hour validity window has passed -- the pending change is cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: EXPIRED, message: "That verification link has expired. Please request the change again." }

  /auth/undo-email-change:
    post:
      tags: [Auth]
      summary: Undo a login-email change from the link sent to the OLD address
      description: >-
        `token` is the signed token (same HS256 format as a bearer token,
        but with `purpose: email-change-undo` and no `sub`, so it can never
        authenticate a request) embedded in the link `POST
        /users/me/change-email` emails to the old address -- it carries the
        account id, both addresses and when the change was requested, and
        is valid for 30 days. Restores the old address as the login email
        (whether or not the new one was already verified), cancels any
        pending change, and -- since an unwanted change suggests someone
        else knows the password -- ends every session and returns a
        short-lived (1 hour), single-use `resetToken` for
        `POST /auth/reset-password`, so the owner can set a new password
        without knowing the current one. Only honored for the account's
        most recent change request, and only once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Undone.
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: string, format: email, description: The restored login email. }
                  resetToken: { type: string }
        "400":
          description: Invalid, expired, already used, or superseded by a newer change request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: INVALID_TOKEN, message: "That link is invalid, has expired, or has already been used." }
        "409":
          description: The old address belongs to another account by now, so it can't be restored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: EMAIL_TAKEN, message: "An account with that email already exists." }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Email a link to set a new password ("Forgot password?")
      description: >-
        If an account (open or closed) has this email, it's sent a link to
        the client (`?resetPassword=<resetToken>`, see
        `POST /auth/reset-password`) that sets a new password without the
        current one. The link is valid for 30 minutes and works once: it's
        bound to the account's password version, so setting a new password
        voids it -- and any other unused link. Always answers 202, whether
        or not the email has an account, so it can't be used to find out
        which emails do.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: Accepted (sent, if the email has an account).
        "400":
          description: Not a valid email address.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: INVALID_EMAIL, message: "Enter a valid email address." }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password with a reset token
      description: >-
        `resetToken` comes from a "Forgot password?" link
        (`POST /auth/forgot-password`) or from
        `POST /auth/undo-email-change`. Single-use (it's bound to the
        password version it was issued for). Ends every other session, like
        `POST /users/me/change-password`, and logs this one in. A closed
        (deleted) account is reopened, empty -- the response then has
        `restored: true`, as for `POST /auth/login`; one that's due for
        automatic deletion (12 months' inactivity, a scheduled deletion)
        answers 410 like a login would.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resetToken, newPassword]
              properties:
                resetToken: { type: string }
                newPassword: { type: string, format: password, minLength: 8 }
      responses:
        "200":
          description: Changed, and logged in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { $ref: "#/components/schemas/Token" }
                  user: { $ref: "#/components/schemas/User" }
                  restored:
                    type: boolean
                    description: Present (true) only when this reopened a closed (deleted) account.
        "400":
          description: newPassword is under 8 characters (INVALID_PASSWORD), or resetToken is invalid/expired/already used (INVALID_TOKEN).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Exchange email + password for a bearer token
      description: >-
        Never distinguishes "no such account" from "wrong password" in the
        response (both are `INVALID_CREDENTIALS`) -- only an account that
        genuinely exists but hasn't verified its email yet gets its own
        `EMAIL_NOT_VERIFIED` code, so a mistyped email a visitor never
        actually registered doesn't leak which emails are/aren't
        registered. Also where the 12-month-inactivity and
        scheduled-account-deletion policies (see the Privacy Policy and
        `DELETE /users/me/schedule-deletion`) actually take effect: logging
        into an account that's now due for either kind of deletion deletes
        it right here, before a token is ever issued for it.

        Deleting an account (either way, or `DELETE /users/me`) closes it
        rather than erasing it outright: for a year it keeps only its
        email, password hash and whether it ever had a trial or
        subscription. Logging in to a closed account with the right
        password within that year reopens it, empty (`restored: true`),
        without a new free trial if it had one; its email stays taken for
        registering or changing another account's login email to it
        (`EMAIL_TAKEN`). After the year it's gone for good.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { $ref: "#/components/schemas/Token" }
                  user: { $ref: "#/components/schemas/User" }
                  restored:
                    type: boolean
                    description: Present (true) only when this login reopened a closed (deleted) account -- it starts out empty.
        "401":
          description: Wrong email or password.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: INVALID_CREDENTIALS, message: "Incorrect email or password." }
        "403":
          description: The account exists but its email hasn't been verified yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: EMAIL_NOT_VERIFIED, message: "That email hasn't been verified yet." }
        "410":
          description: The account existed but has just been deleted (inactivity or scheduled deletion) as part of processing this request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                inactivity:
                  value: { code: ACCOUNT_EXPIRED_INACTIVITY, message: "This account was automatically deleted after 12 months of inactivity." }
                scheduled:
                  value: { code: ACCOUNT_DELETED_SCHEDULED, message: "This account was deleted, as scheduled, once its subscription ended." }

  /auth/me:
    get:
      tags: [Auth]
      summary: Resolve the current bearer token into the live account it belongs to
      description: >-
        The one endpoint that can tell a still-valid session apart from one
        that isn't anymore -- a token's own claims are a snapshot from
        whenever it was issued, not live truth (see the `Token` schema), so
        the client is expected to call this (not just trust a locally
        decoded token) whenever it needs to know the account is still
        genuinely there, e.g. once per app load. Applies the same
        12-month-inactivity/scheduled-deletion checks `POST /auth/login`
        does, since resuming a stored token is just as much "using the
        account" as a fresh login -- touches the account's `lastActiveAt`
        (server-internal bookkeeping, not part of the `User` schema below,
        since the client never needs to read it) the same way a fresh
        `POST /auth/login` touches `lastLoginAt`, so a long-lived token
        that keeps getting resumed here isn't wrongly treated as abandoned.
      responses:
        "200":
          description: Still a live account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: Missing/malformed/expired bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: The account behind this token is gone -- deleted outright (`ACCOUNT_NOT_FOUND`, e.g. from Settings or another session), for 12-month inactivity, or per a completed scheduled deletion. The client must treat any of these as "not logged in" and discard the token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                notFound:
                  value: { code: ACCOUNT_NOT_FOUND, message: "This account no longer exists." }
                inactivity:
                  value: { code: ACCOUNT_EXPIRED_INACTIVITY, message: "This account was automatically deleted after 12 months of inactivity." }
                scheduled:
                  value: { code: ACCOUNT_DELETED_SCHEDULED, message: "This account was deleted, as scheduled, once its subscription ended." }

  /users/me:
    patch:
      tags: [Users]
      summary: Update the current account's profile/preferences
      description: >-
        Partial update -- send only the fields you're changing. Covers
        everything Settings can change (nickname, avatar, time format,
        background, language, theme, first day of the week) plus the to-do
        list's current view mode. (The focused occurrence is set through
        `PUT`/`DELETE /focus`, which keep its timer and focus time.) None of
        this affects the bearer token's own claims, so the token stays valid
        and unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string }
                avatar:
                  type: string
                  nullable: true
                  description: A data URL (the client square-crops/downscales client-side before sending) or null to remove it.
                timeFormat: { type: string, enum: ["12", "24"] }
                background:
                  allOf: [{ $ref: "#/components/schemas/Background" }]
                  nullable: true
                language:
                  type: string
                  nullable: true
                  description: One of `GET /languages` (400 `VALIDATION_ERROR` otherwise), or null to choose again.
                theme:
                  type: string
                  enum: [dark, light]
                weekStart:
                  type: integer
                  minimum: 0
                  maximum: 6
                  nullable: true
                todoViewMode:
                  type: string
                  enum: [pending, next-recurrence, all]
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: Missing/invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Users]
      summary: Delete the current account and all its data, immediately
      description: >-
        Deletes every task/note/preference tied to the account and closes
        it: only its email, password hash and trial status are kept, for a
        year (see `POST /auth/login` -- logging in again reopens it, empty).
        Takes effect immediately and the data can't be restored -- this is the
        "Delete immediately" choice in Settings' danger zone. A paying
        subscriber choosing to keep access until their current billing
        period ends instead wants `POST /users/me/schedule-deletion`, not
        this.
      responses:
        "204":
          description: Deleted. The bearer token used for this request is invalid from this point on.
        "401":
          description: Missing/invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /users/me/change-password:
    post:
      tags: [Users]
      summary: Change the current account's password
      description: >-
        Requires the current password, not just a valid bearer token, for
        the same reason `POST /auth/login` exists as its own step rather
        than folding into "anything holding a token can act as this
        account": a stolen/leaked token alone shouldn't be enough to lock
        the real account holder out by silently swapping their password.
        Re-issues a fresh token in the response, the same way every other
        endpoint that changes something the account's credentials reflect
        does (see the `Token` schema) -- the client is expected to discard
        the old one immediately, and the server is expected to invalidate
        every *other* outstanding token for this account at the same time,
        the way changing a password ought to end every other session but
        this one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword:
                  type: string
                  format: password
                  minLength: 8
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { $ref: "#/components/schemas/Token" }
        "400":
          description: newPassword is under 8 characters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: INVALID_PASSWORD, message: "Password must be at least 8 characters." }
        "401":
          description: Missing/invalid bearer token, or currentPassword doesn't match the account's actual current password.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: INVALID_CREDENTIALS, message: "Incorrect current password." }

  /users/me/change-email:
    post:
      tags: [Users]
      summary: Start changing the account's login email
      description: >-
        Requires the current password, like `change-password`. Doesn't
        change the login email yet: the NEW address gets a verification
        link (6 hours, see `POST /auth/verify-email-change`), and the OLD
        address gets a notice with an undo link (30 days, see `POST
        /auth/undo-email-change`). Until the new address is verified, the old
        one keeps working for login; a newer request replaces a pending one
        (and invalidates the older undo link).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newEmail, currentPassword]
              properties:
                newEmail: { type: string, format: email }
                currentPassword: { type: string, format: password }
      responses:
        "200":
          description: Requested -- the returned User carries `pendingEmail`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: newEmail isn't a valid address (INVALID_EMAIL), or is already this account's email (SAME_EMAIL).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing/invalid bearer token, or currentPassword doesn't match.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: INVALID_CREDENTIALS, message: "Incorrect current password." }
        "409":
          description: Another account (or a pending registration) already uses newEmail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: EMAIL_TAKEN, message: "An account with that email already exists." }

  /users/me/schedule-deletion:
    post:
      tags: [Users]
      summary: Schedule the account for deletion once its current subscription period ends
      description: >-
        The alternative to `DELETE /users/me` for a paying subscriber who
        doesn't want to forfeit the rest of a period they already paid for:
        keeps full access until `subscription.expiresAt`, but immediately
        sets `subscription.cancelAtPeriodEnd` (there's nothing left to renew
        into) and `subscription.scheduledDeletion`. The account is actually
        deleted, server-side, once `expiresAt` passes -- via whatever
        mechanism enforces that (a scheduled job, or lazily the next time
        `POST /auth/login`/`GET /auth/me` runs past that point, matching
        this app's existing inactivity-deletion enforcement) -- unless
        `DELETE /users/me/schedule-deletion` cancels it first.
      responses:
        "200":
          description: Scheduled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { $ref: "#/components/schemas/Token" }
                  user: { $ref: "#/components/schemas/User" }
        "401":
          description: Missing/invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: No active subscription to schedule deletion against.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: NO_ACTIVE_SUBSCRIPTION, message: "There's no active subscription to schedule deletion for." }
    delete:
      tags: [Users]
      summary: Cancel a previously scheduled deletion
      description: >-
        Undoes `POST /users/me/schedule-deletion`'s `scheduledDeletion`
        flag. Deliberately leaves `cancelAtPeriodEnd` alone: "cancel the
        deletion" only promises to keep the account around, not to
        silently resume billing the account holder never explicitly asked
        to resume.
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { $ref: "#/components/schemas/Token" }
                  user: { $ref: "#/components/schemas/User" }
        "401":
          description: Missing/invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: No subscription (scheduled for deletion or otherwise) to act on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: NO_SUBSCRIPTION, message: "There's no subscription to cancel deletion for." }

  # ---------------------------------------------------------------------------
  # The to-do list: reads computed server-side, one local day at a time
  # ---------------------------------------------------------------------------

  /days:
    get:
      tags: [Lists]
      summary: One local day of a list view
      description: >-
        The items one view shows on one of the user's local days -- or, if
        that day has none, on the nearest day that has some in `direction`
        -- with the nearest days that have items either side of it. The
        client loads its list a day at a time this way: from today (or the
        1st of another month), as far as the screen needs, and more as it
        scrolls. `previousDate`/`nextDate` are given even across a month
        boundary; whether to follow them is the client's call ("pending" and
        "all" are paged by month, "next-recurrence" isn't).


        The views: `pending` -- every overdue or failed occurrence since the
        start of the date's month, dismissed or not, plus (in the current
        month) today's and tomorrow's; `next-recurrence` -- per task, today's
        occurrence, the previous one while unresolved and not dismissed (a
        resolved one is shown once, then dismissed), the next one when
        neither is pending, and from 18:00 tomorrow's; `all` -- every
        occurrence in the date's month. Within a day, items come in display
        order: all-day first, then by due time, then by name. A free account
        also gets the subscription reminder on today (see `Item.virtual`).
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
        - name: view
          in: query
          schema: { type: string, enum: [pending, next-recurrence, all], default: pending }
        - name: date
          in: query
          description: A local date; default today.
          schema: { type: string, format: date }
        - name: direction
          in: query
          description: Where to look when `date` has nothing.
          schema: { type: string, enum: [after, before], default: after }
      responses:
        "200":
          description: The day.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ReadResult"
                  - type: object
                    required: [date, items, previousDate, nextDate, today]
                    properties:
                      date:
                        type: string
                        format: date
                        nullable: true
                        description: The day the items are on -- `date` itself, the nearest day with items in `direction`, or null if there's none (within about three months).
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Item" }
                      previousDate:
                        type: string
                        format: date
                        nullable: true
                        description: The nearest earlier day with items, or null.
                      nextDate:
                        type: string
                        format: date
                        nullable: true
                        description: The nearest later day with items, or null.
                      today:
                        type: string
                        format: date
                        description: Today, in the user's time zone.
                      focused:
                        allOf: [{ $ref: "#/components/schemas/Item" }]
                        nullable: true
                        description: >-
                          The focused occurrence, wherever it is (null: none)
                          -- the only one whose timer can be running, so the
                          client can show it while its own day isn't loaded or
                          on screen.
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyReads" }

  /agenda:
    get:
      tags: [Lists]
      summary: Everything on one local day, with how long each usually takes
      description: >-
        The side panel's timeline: every occurrence on the day (the `all`
        view's, without the subscription reminder), each with
        `durationMinutes` -- the average time measured on the task's earlier
        occurrences, or 30 minutes -- and whether its due time can be
        dragged (`PUT /tasks/{taskId}/due-time`).
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
        - name: date
          in: query
          description: A local date; default today.
          schema: { type: string, format: date }
      responses:
        "200":
          description: The day's agenda.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ReadResult"
                  - type: object
                    required: [date, items]
                    properties:
                      date: { type: string, format: date }
                      focused:
                        allOf: [{ $ref: "#/components/schemas/Item" }]
                        nullable: true
                        description: As `GET /days`' `focused`.
                      now: { $ref: "#/components/schemas/EpochMillis" }
                      sessions:
                        type: array
                        description: >-
                          Every focus/timer session that ran during the day,
                          where it ran -- stored ones, and the one still
                          running (`endMs: null`, `id: null`).
                        items: { $ref: "#/components/schemas/FocusSession" }
                      items:
                        type: array
                        items:
                          allOf:
                            - $ref: "#/components/schemas/Item"
                            - type: object
                              required: [durationMinutes, draggable]
                              properties:
                                durationMinutes: { type: integer }
                                draggable: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyReads" }

  /focus-sessions/{sessionId}:
    delete:
      tags: [Lists]
      summary: Delete one focus/timer session (a bad measurement)
      description: >-
        Its seconds come off the occurrence's measured totals (stats and the
        agenda's usual durations) too. 404 `SESSION_NOT_FOUND`.
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /focus:
    put:
      tags: [Lists]
      summary: Focus one occurrence ("Work on this now", or resuming its timer)
      description: >-
        Only one occurrence is focused at a time. Focusing checkpoints the
        previously focused one -- its timer pauses, or its focus time is
        credited -- and starts this one's: its timer runs if it has one,
        otherwise focus time is measured. Only an occurrence due today or
        carried over, not done (a failed appointment can be, and doesn't
        count as failed while focused), of a task that isn't passive or
        locked can be focused (409 `NOT_FOCUSABLE`).
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId, occurrenceDate]
              properties:
                taskId: { type: string }
                occurrenceDate: { type: string, format: date }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Refused" }
    delete:
      tags: [Lists]
      summary: Focus nothing (also "Pause timer")
      description: Checkpoints the focused occurrence, as above.
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /manage:
    get:
      tags: [Lists]
      summary: Manage Tasks' months -- which series have occurrences in which month
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      responses:
        "200":
          description: Months, newest first, each with its series by name.
          content:
            application/json:
              schema:
                type: object
                required: [months]
                properties:
                  months:
                    type: array
                    items:
                      type: object
                      required: [month, series]
                      properties:
                        month: { type: string, example: "2026-10" }
                        series:
                          type: array
                          items:
                            type: object
                            required: [seriesId, name, taskCount, mixed]
                            properties:
                              seriesId: { type: string }
                              name: { type: string }
                              taskCount:
                                type: integer
                                description: 1 for a single task, which can be dragged into another series (`POST /series/{seriesId}/members`).
                              mixed: { type: boolean, description: "Its tasks have different names (they're shown as \"series: task\")." }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /series/{seriesId}:
    parameters:
      - { $ref: "#/components/parameters/SeriesId" }
    get:
      tags: [Lists]
      summary: A series and its tasks
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
        - name: notes
          in: query
          description: "`1` adds every member's notes and activity, and their occurrences' -- the side panel's series scope."
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: The series.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SeriesDetail"
                  - type: object
                    properties:
                      notes:
                        type: array
                        description: With `notes=1` -- each member's own notes and activity.
                        items:
                          type: object
                          properties:
                            taskId: { type: string }
                            name: { type: string }
                            dueDate: { type: string, format: date }
                            comments: { type: array, items: { $ref: "#/components/schemas/Comment" } }
                            log: { type: array, items: { $ref: "#/components/schemas/LogEntry" } }
                      occurrences:
                        type: array
                        description: With `notes=1` -- every member occurrence with notes or activity.
                        items:
                          type: object
                          properties:
                            taskId: { type: string }
                            occurrenceDate: { type: string, format: date }
                            comments: { type: array, items: { $ref: "#/components/schemas/Comment" } }
                            log: { type: array, items: { $ref: "#/components/schemas/LogEntry" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Lists]
      summary: Rename a series
      description: The series' own name -- never any task's own (see `POST /tasks/{taskId}/reset-name`).
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 500 }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /series/{seriesId}/members:
    parameters:
      - { $ref: "#/components/parameters/SeriesId" }
    post:
      tags: [Lists]
      summary: Move a single task's series into this one
      description: >-
        Only a series of one task can be moved (409 `NOT_A_SINGLE_TASK`) --
        two series of several are never merged.
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seriesId]
              properties:
                seriesId: { type: string, description: The single task's series. }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Refused" }

  /stats:
    get:
      tags: [Lists]
      summary: Stats for a task, a series or all tasks
      description: >-
        Counted from the scope's last stats reset, when every task in it was
        reset together (`since`). Completions and occurrences count from a
        task's reset on; measured time is what's left after it.
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
        - { $ref: "#/components/parameters/StatsScope" }
      responses:
        "200":
          description: The stats.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /stats/reset:
    post:
      tags: [Lists]
      summary: Start the scope's stats over now
      description: >-
        Clears every measured focus/timer time in scope and records the
        moment on each task (`statsResetAt`); the tasks' history is
        untouched.
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope: { type: string, description: "As `GET /stats`'s `scope`." }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /stats/focus-time:
    delete:
      tags: [Lists]
      summary: Delete one date's measured time across the scope (a bad measurement)
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
        - { $ref: "#/components/parameters/StatsScope" }
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /export:
    get:
      tags: [Lists]
      summary: Download my data
      description: >-
        The whole account as one file -- every task and occurrence (activity
        logs left out: they're this account's own history, not data to carry
        over), the profile and the view mode. `POST /imports` takes it back.
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      responses:
        "200":
          description: The export.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Export" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------------------
  # One task: reads, and an action endpoint per change
  # ---------------------------------------------------------------------------

  /tasks:
    post:
      tags: [Tasks]
      summary: Create a task
      description: >-
        A free account is limited to 10 one-off and 5 recurring tasks (402
        `TASK_LIMIT`). A `recurUntilCompleted` task starts on the first date
        its pattern produces from `dueDate`. A passive task can't recur until
        completed (400 `VALIDATION_ERROR`).
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TaskDetailsInput"
                - $ref: "#/components/schemas/PatternInput"
                - type: object
                  properties:
                    seriesId:
                      type: string
                      nullable: true
                      description: An existing series to join (Manage Tasks' "Add new task"); otherwise the task is its own.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ActionResult"
                  - type: object
                    required: [taskId]
                    properties:
                      taskId: { type: string }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PlanLimit" }

  /tasks/{taskId}:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
    get:
      tags: [Tasks]
      summary: A task with everything about it
      description: >-
        Its fields, notes and activity; the task editor's list of its
        occurrences (`occurrenceList`); every recorded occurrence with its
        own notes and activity; and its series. The side panel's
        task/occurrence scopes read this.
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
        - name: extraDate
          in: query
          description: Upcoming dates to list in `occurrenceList` too ("Find occurrence…" picks them before anything is recorded on them). Repeatable.
          schema:
            type: array
            items: { type: string, format: date }
          style: form
          explode: true
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tasks]
      summary: Edit the task's details (the editor's Details tab)
      description: >-
        Name, description, details, time, time zone and flags -- for every
        occurrence, past and future. Send every field (the tab's whole
        state); nothing changes (and nothing is logged) when none differs.
        A `recurUntilCompleted` task can't be made passive (400
        `VALIDATION_ERROR`) -- turn that off first (`PUT .../pattern`).
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskDetailsInput" }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Tasks]
      summary: Delete the task and all its occurrences
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{taskId}/dates:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
    get:
      tags: [Tasks]
      summary: The dates a task occurs on in a range
      description: >-
        For calendars that only offer the task's own dates ("Find
        occurrence…"), and the last date it can ever occur on (pausing can't
        resume past it).
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - name: to
          in: query
          required: true
          description: At most about a year after `from`.
          schema: { type: string, format: date }
      responses:
        "200":
          description: The dates.
          content:
            application/json:
              schema:
                type: object
                required: [dates, last]
                properties:
                  dates:
                    type: array
                    items: { type: string, format: date }
                  last:
                    type: string
                    format: date
                    nullable: true
                    description: The last date the task can occur on; null = no end.
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{taskId}/pattern:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
    put:
      tags: [Tasks]
      summary: Change the recurrence pattern (the editor's Recurrence tab), from today on
      description: >-
        Everything before today stays as it was: a plain task's dates the
        old pattern produced before today are saved as occurrences, and the
        new pattern starts today. A one-off just moves (with what's recorded
        on it). A task staying `recurUntilCompleted` keeps its live
        occurrence (unless that's still the blank next cycle, which is
        recomputed). Ends a plain task's pause. Turning a one-off into a
        recurring task or back counts against the free plan's limits like
        creating one (402 `TASK_LIMIT`). A passive task can't be made to
        recur until completed (400 `VALIDATION_ERROR`) -- turn passive off
        first (`PATCH /tasks/{taskId}`). Nothing changes when the pattern is
        the same.
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatternInput" }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PlanLimit" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{taskId}/due-time:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
    put:
      tags: [Tasks]
      summary: Move the due time (the agenda's drag)
      description: >-
        `dueTime` is the user's local time on `date`; a task fixed to
        another time zone is given the matching time in its own zone. No
        effect on an all-day task.
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dueTime]
              properties:
                dueTime: { type: string, example: "14:30" }
                date: { type: string, format: date, description: The agenda's day; default today. }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{taskId}/pause:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
    post:
      tags: [Tasks]
      summary: Pause recurrence from an occurrence until a date
      description: >-
        Every occurrence from `from` (inclusive) up to `until` is hidden;
        the task occurs on `until` (even if its pattern doesn't land there)
        and continues per its pattern. A plain task's pattern restarts on
        `until` (dates before `from` saved as occurrences, blank ones in
        between dropped); a `recurUntilCompleted` task's live occurrence
        moves there. Pausing again from the resume date extends the pause.
        Refused for a task that can't pause there (409 `NOT_PAUSABLE`), or
        past its last possible date (409 `NOTHING_AFTER`).
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, until]
              properties:
                from: { type: string, format: date, description: The right-clicked occurrence. }
                until: { type: string, format: date, description: The resume date, after `from`. }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Refused" }

  /tasks/{taskId}/resume:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
    post:
      tags: [Tasks]
      summary: Resume a paused task today
      description: >-
        Ends a pause in effect today: a plain task's pattern restarts today
        (with an occurrence today even if the pattern doesn't land there),
        a `recurUntilCompleted` task's live occurrence moves to today. 409
        `NOT_PAUSED` when no pause is in effect, `DATE_TAKEN` when the
        live occurrence can't move onto today.
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Refused" }

  /tasks/{taskId}/reset-name:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
    post:
      tags: [Tasks]
      summary: Give the task its series' name
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{taskId}/leave-series:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
    post:
      tags: [Tasks]
      summary: Take the task out of its series, into one of its own
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{taskId}/notes:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
    post:
      tags: [Tasks]
      summary: Add a note to the task as a whole
      description: >-
        A free account has 5 notes per task, task- and occurrence-level
        together (402 `NOTE_LIMIT`); a task beyond a lapsed account's limits
        takes none (402 `TASK_LOCKED`).
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      requestBody: { $ref: "#/components/requestBodies/NoteText" }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PlanLimit" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{taskId}/notes/{timestamp}:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
      - { $ref: "#/components/parameters/NoteTimestamp" }
    patch:
      tags: [Tasks]
      summary: Edit a task-level note
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      requestBody: { $ref: "#/components/requestBodies/NoteText" }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Tasks]
      summary: Delete a task-level note
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{taskId}/occurrences:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
    post:
      tags: [Tasks]
      summary: Add an extra occurrence on any date
      description: A `manual` occurrence on a date the task doesn't already occur on (409 `OCCURRENCE_EXISTS`).
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Refused" }

  /tasks/{taskId}/occurrences/{date}:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
      - { $ref: "#/components/parameters/OccurrenceDate" }
    delete:
      tags: [Tasks]
      summary: Delete one occurrence
      description: >-
        Only an occurrence `occurrenceList` marks `deletable` (409 `NOT_DELETABLE`).
        A date the pattern still produces is skipped from then on.
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Refused" }

  /tasks/{taskId}/occurrences/{date}/reschedule:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
      - { $ref: "#/components/parameters/OccurrenceDate" }
    post:
      tags: [Tasks]
      summary: Move a recorded occurrence to another date
      description: >-
        Moving it forward skips every date the pattern produces in between.
        Refused for an occurrence `occurrenceList` doesn't mark
        `reschedulable` (409 `NOT_RESCHEDULABLE` -- e.g. a
        `recurUntilCompleted` task's live one), and onto a date that
        already has one (409 `DATE_TAKEN`).
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Refused" }

  /tasks/{taskId}/occurrences/{date}/details:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
      - { $ref: "#/components/parameters/OccurrenceDate" }
    put:
      tags: [Tasks]
      summary: Set one occurrence's own details (on top of the task's)
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                details: { type: string, nullable: true, description: null or empty clears them. }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{taskId}/occurrences/{date}/notes:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
      - { $ref: "#/components/parameters/OccurrenceDate" }
    post:
      tags: [Tasks]
      summary: Add a note to one occurrence
      description: Same limits as `POST /tasks/{taskId}/notes`.
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      requestBody: { $ref: "#/components/requestBodies/NoteText" }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PlanLimit" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{taskId}/occurrences/{date}/notes/{timestamp}:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
      - { $ref: "#/components/parameters/OccurrenceDate" }
      - { $ref: "#/components/parameters/NoteTimestamp" }
    patch:
      tags: [Tasks]
      summary: Edit an occurrence's note
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      requestBody: { $ref: "#/components/requestBodies/NoteText" }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Tasks]
      summary: Delete an occurrence's note
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{taskId}/occurrences/{date}/timer:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
      - { $ref: "#/components/parameters/OccurrenceDate" }
    post:
      tags: [Tasks]
      summary: Set a timer on an occurrence (and start it)
      description: >-
        A countdown of `minutes` (at most 360), or with `countUp` a
        stopwatch. `continuePastZero` keeps a countdown running as overtime.
        Either way a timer stops by itself after 360 minutes. With `start`
        (default) the occurrence is focused and the timer runs; without, it
        waits, paused, for the occurrence's next focus. Only an occurrence
        that could be focused (409 `NOT_FOCUSABLE`).
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                auto:
                  type: boolean
                  description: >-
                    The auto timer: a countdown of the task's average measured
                    time (`Item.autoTimerSeconds`), started at once and
                    continuing past zero -- the other fields are ignored. 409
                    `NO_AUTO_TIMER` for a task never measured or not recurring.
                countUp: { type: boolean, default: false }
                minutes: { type: integer, minimum: 1, maximum: 360, description: Required unless countUp. }
                continuePastZero: { type: boolean, default: false }
                start: { type: boolean, default: true }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Refused" }
    delete:
      tags: [Tasks]
      summary: Cancel an occurrence's timer
      description: The time it ran is credited. A focused occurrence stays focused, without a timer.
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{taskId}/occurrences/{date}/{action}:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
      - { $ref: "#/components/parameters/OccurrenceDate" }
      - name: action
        in: path
        required: true
        schema: { type: string, enum: [complete, reopen, fail, unfail, dismiss, restore] }
    post:
      tags: [Tasks]
      summary: Resolve an occurrence, take that back, or hide/show it
      description: >-
        `complete`/`reopen` (a passive task: `fail`/`unfail` -- its checkbox
        marks it failed); `dismiss`/`restore` hide a carried-over occurrence
        from the list or show it again. Completing also dismisses the task's
        earlier missed occurrences and stops a timer on this one. A
        `recurUntilCompleted` task: completing records it done on this date
        and starts the next cycle; reopening takes that cycle back -- refused
        once a later cycle has been resolved (409 `REOPEN_BLOCKED`). Not for
        a future occurrence (409 `NOT_DUE`), nor a task beyond a lapsed
        account's limits (402 `TASK_LOCKED`). Which of these an item allows
        is in its `actions`.
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      responses:
        "200": { $ref: "#/components/responses/Action" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PlanLimit" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Refused" }

  # ---------------------------------------------------------------------------
  # Imports: uploaded in chunks, committed in one go
  # ---------------------------------------------------------------------------

  /imports:
    post:
      tags: [Imports]
      summary: Start an import
      description: >-
        Settings' "Import data": a file from `GET /export` (or an older
        export) is uploaded in chunks -- whole tasks with their occurrences
        -- then committed, replacing every task of the account in one
        transaction. Nothing changes until the commit, so a failed or
        abandoned upload leaves the account as it was; an import not
        committed within an hour expires. Starting one drops any earlier
        unfinished import of the account.
      responses:
        "201":
          description: Started.
          content:
            application/json:
              schema:
                type: object
                required: [importId, maxChunks]
                properties:
                  importId: { type: string, format: uuid }
                  maxChunks: { type: integer, example: 500 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /imports/{importId}/chunks:
    parameters:
      - { $ref: "#/components/parameters/ImportId" }
    post:
      tags: [Imports]
      summary: Upload one chunk
      description: >-
        At most 1 MB, one at a time, at least 200 ms after the previous one
        (429 `TOO_FAST` with `Retry-After` -- wait and send it again).
        Re-sending a `seq` replaces it. Each task and occurrence is checked
        just enough that the rules can't choke on it; old formats are
        brought up to date at the commit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seq, tasks, occurrences]
              properties:
                seq: { type: integer, minimum: 0, description: "0 .. maxChunks - 1, in order." }
                tasks:
                  type: array
                  items: { $ref: "#/components/schemas/Task" }
                occurrences:
                  type: array
                  items: { $ref: "#/components/schemas/Occurrence" }
      responses:
        "204":
          description: Staged.
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: The chunk is over 1 MB.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: "`TOO_FAST` -- sent too soon after the previous chunk."
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /imports/{importId}/commit:
    parameters:
      - { $ref: "#/components/parameters/ImportId" }
    post:
      tags: [Imports]
      summary: Replace the account's tasks with the uploaded ones
      description: >-
        In one transaction: the chunks are assembled, older formats brought
        up to date (several records per task merged into one, ...), a free
        account's import trimmed to what it could have created itself (the
        first 10 one-off and 5 recurring tasks by creation, 5 notes per
        task -- `limited`), every task replaced. Each task's activity starts
        over with its import; nothing is focused afterwards.
      parameters:
        - { $ref: "#/components/parameters/XTimezone" }
      responses:
        "200":
          description: Imported.
          content:
            application/json:
              schema:
                type: object
                required: [taskCount, limited]
                properties:
                  taskCount: { type: integer }
                  limited: { type: boolean, description: The free plan's limits left some tasks or notes out. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /imports/{importId}:
    parameters:
      - { $ref: "#/components/parameters/ImportId" }
    delete:
      tags: [Imports]
      summary: Abandon an import
      responses:
        "204":
          description: Abandoned (or there was nothing to abandon).
        "401": { $ref: "#/components/responses/Unauthorized" }

  /subscriptions/trial:
    post:
      tags: [Subscriptions]
      summary: Start a 14-day Pro trial for the current account
      description: >-
        Identical to a paid Pro subscription while it lasts. Only for an
        account that has never had any plan -- one trial per account, and
        none after a paid subscription, even a cancelled or expired one
        (those subscribe again through checkout). Deleting the account
        doesn't reset this: a closed account keeps its trial status for the
        year it's kept, and reopening it doesn't bring back a trial (see
        `POST /auth/login`). See the User's `trialAvailable`.
      responses:
        "200":
          description: Trial started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { $ref: "#/components/schemas/Token" }
                  user: { $ref: "#/components/schemas/User" }
        "401":
          description: Missing/invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The account has already had a trial or a subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: TRIAL_UNAVAILABLE, message: "This account has already had a trial or a subscription." }

  /subscriptions/checkout-sessions:
    post:
      tags: [Subscriptions]
      summary: Start a Stripe Checkout session for a Pro subscription
      description: >-
        Creates a Stripe Checkout session server-side (Stripe API keys
        never touch the client) and returns the URL to redirect the
        browser to. Stripe redirects back to `successUrl`/`cancelUrl`
        (this app's `success.html`/`cancel.html`) once the visitor finishes
        or abandons payment on Stripe's own hosted page; the client polls
        `GET /subscriptions/checkout-sessions/{sessionId}` (from
        `checkout.html`, the intermediate page shown while waiting) to find
        out which. The session is a recurring (auto-renewing) subscription;
        nothing is activated here -- the subscription starts once Stripe
        reports the payment (`POST /stripe/webhook`), which is also when the
        payment's receipt is fiscalized (Croatian B2C fiscalization) and
        emailed. Refused with 503 `PAYMENTS_UNAVAILABLE` before anything is
        created in Stripe whenever payments can't be fiscalized (live
        Stripe keys without a usable certificate for the production
        fiscalization service), Stripe isn't configured, or the plan has no
        product or price to sell. The plan is charged at its price in the
        published price list right now (the same price the website shows),
        as the Stripe Product the price list's product names. With Stripe test
        keys, payments are always allowed; their receipts are fiscalized
        against the test service, or skipped when no certificate is set up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [billingInterval, successUrl, cancelUrl]
              properties:
                billingInterval:
                  type: string
                  enum: [monthly, annual]
                successUrl:
                  type: string
                  format: uri
                  description: Where Stripe redirects on completed payment (this app's success.html).
                cancelUrl:
                  type: string
                  format: uri
                  description: Where Stripe redirects if the visitor backs out (this app's cancel.html).
      responses:
        "200":
          description: Session created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string }
                  checkoutUrl:
                    type: string
                    format: uri
                    description: Stripe's own hosted checkout page -- redirect the browser here.
        "401":
          description: Missing/invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >-
            The account already has a paid-up Pro subscription -- a second one
            would charge again for time already paid for. `ALREADY_SUBSCRIBED`
            while it renews; `SUBSCRIPTION_CANCELLING` once cancelled but
            still running, which `POST /subscriptions/resume` takes back
            instead (charging nothing until its period ends).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: ALREADY_SUBSCRIBED, message: "This account already has an active subscription." }
        "503":
          description: Payments are unavailable (not configured, or fiscalization has no usable certificate) -- nothing was created in Stripe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: PAYMENTS_UNAVAILABLE, message: "Payments are temporarily unavailable." }

  /stripe/webhook:
    post:
      tags: [Subscriptions]
      summary: Stripe event deliveries
      description: >-
        Called by Stripe, not the client; authenticated by the
        `Stripe-Signature` header (the endpoint's signing secret), not a
        bearer token. Handles checkout.session.completed/expired,
        invoice.paid (every payment, first and renewals: extends the
        subscription and issues a fiscalized receipt),
        customer.subscription.updated/deleted, refund.created/updated (a
        refund of a fiscalized payment gets a fiscalized storno receipt --
        a new receipt for the negative refunded amount, naming the one it
        cancels -- emailed to the customer) and charge.dispute.created
        (the business owner is emailed to respond in Stripe). Idempotent. Answers 5xx when
        an event can't be processed yet (e.g. a payment arriving while
        fiscalization is unavailable), so Stripe re-delivers it later.
      security: []
      responses:
        "200":
          description: Processed (or not an event type this API acts on).
        "400":
          description: Missing or invalid signature.

  /subscriptions/checkout-sessions/{sessionId}:
    get:
      tags: [Subscriptions]
      summary: Poll a checkout session's status
      description: >-
        `checkout.html` polls this until `status` is no longer `pending`.
        Once `paid`, `token`/`user` reflect the now-active Pro
        subscription, same shape as every other subscription-mutating
        endpoint's response, ready to replace whatever's currently stored
        client-side.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current status.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [pending, paid, cancelled]
                  token: { $ref: "#/components/schemas/Token" }
                  user: { $ref: "#/components/schemas/User" }
        "401":
          description: Missing/invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such checkout session (for this account).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /subscriptions/portal-session:
    post:
      tags: [Subscriptions]
      summary: Open Stripe's Customer Portal ("Manage billing")
      description: >-
        Creates a Stripe Customer Portal session for this account's Stripe
        customer: there the customer can update their card and cancel (at
        period end) or undo a pending cancellation; switching plans, invoice
        history and editing their email/address are disabled. Changes made
        there reach the account through `POST /stripe/webhook`. Only for an
        account that has been through checkout; refused with 503
        `PAYMENTS_UNAVAILABLE` whenever checkout would be.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [returnUrl]
              properties:
                returnUrl:
                  type: string
                  format: uri
                  description: Where the portal's "return" link goes (this app's index.html).
      responses:
        "200":
          description: Session created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                    description: Stripe's hosted portal page -- redirect the browser here.
        "401":
          description: Missing/invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The account has no Stripe customer (never subscribed through checkout).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: NO_BILLING_ACCOUNT, message: "This account has never subscribed, so there is no billing to manage." }
        "503":
          description: Payments are unavailable (Stripe or fiscalization not configured).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: PAYMENTS_UNAVAILABLE, message: "Payments are temporarily unavailable." }

  /subscriptions/cancel:
    post:
      tags: [Subscriptions]
      summary: Cancel the current subscription at period end
      description: >-
        Stops future renewal; access/limits are untouched until
        `expiresAt`, same as a real "cancel at period end" would behave.
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { $ref: "#/components/schemas/Token" }
                  user: { $ref: "#/components/schemas/User" }
        "401":
          description: Missing/invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: No active subscription to cancel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: NO_ACTIVE_SUBSCRIPTION, message: "There's no active subscription to cancel." }

  /subscriptions/resume:
    post:
      tags: [Subscriptions]
      summary: Resume a cancelled subscription before its period ends
      description: >-
        Undoes a cancellation (`POST /subscriptions/cancel`, or one made in
        Stripe's Customer Portal) while the paid period is still running:
        the subscription renews again at `expiresAt`, as if never cancelled.
        Nothing is charged now. Also calls off a scheduled account deletion
        (`POST /users/me/schedule-deletion`), since renewing an account due
        for deletion makes no sense.
      responses:
        "200":
          description: Resumed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { $ref: "#/components/schemas/Token" }
                  user: { $ref: "#/components/schemas/User" }
        "401":
          description: Missing/invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: No cancelled, still-active subscription to resume.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: NO_CANCELLED_SUBSCRIPTION, message: "There's no cancelled, still-active subscription to resume." }
        "503":
          description: Stripe isn't configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /languages:
    get:
      tags: [Translations]
      summary: Every language the interface is in
      description: >-
        For the client's language list (Settings) -- each language by its
        own name ("hrvatski"). Languages are added in the admin app
        (a new one starts as a copy of another's texts). Public.
      security: []
      responses:
        "200":
          description: The languages, by code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  languages:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: hr }
                        name: { type: string, example: hrvatski }

  /translations:
    get:
      tags: [Translations]
      summary: The interface texts of a language
      description: >-
        Every text of the given bundles in a language, by key -- the client
        has none built in. Bundles: `common` (every page), `app` (the to-do
        app, including the activity log's `log.*` texts -- see LogEntry's
        `key`), and one per marketing/legal page (`landing` -- with
        `landing.videoUrl`, the walkthrough video's link -- `checkout`,
        `success`, `cancel`, `faq`, `support`, `privacy`, `terms`). A text
        the language lacks comes back in English; an unknown language is
        English altogether. Texts may hold markup (the keys the client puts
        through innerHTML) and `{name}` placeholders. Edited in the admin
        app, so sent with `Cache-Control: no-cache` and an ETag: a reload
        revalidates. Public.
      security: []
      parameters:
        - name: lang
          in: query
          schema: { type: string, example: hr }
        - name: bundles
          in: query
          required: true
          description: Comma-separated.
          schema: { type: string, example: "common,app" }
      responses:
        "200":
          description: The texts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  language:
                    type: string
                    description: The language the texts are in (`en` if the one asked for doesn't exist).
                  strings:
                    type: object
                    additionalProperties: { type: string }
        "400":
          description: VALIDATION_ERROR -- no bundles named.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /support:
    post:
      tags: [Support]
      summary: Send a message to support
      description: >-
        A-To-Do's support form (the client's support.html): billing, account
        trouble, bugs, suggestions, complaints. Public -- it works logged
        out, since someone who can't log in needs it most -- but a valid
        bearer token, if sent, files the message under its account (an
        invalid one is just ignored). Stored with the website's own contact
        submissions (the admin app's Contact tab) and emailed to the
        business owner. Rate-limited like `POST /auth/register`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, kind, msg]
              properties:
                name: { type: string }
                email: { type: string, format: email, description: Where the reply goes. }
                kind: { type: string, enum: [billing, account, bug, feature, complaint, other] }
                msg: { type: string, maxLength: 10000 }
                context:
                  type: object
                  description: What helps diagnose a report; each at most 500 characters, anything else ignored.
                  properties:
                    appVersion: { type: string }
                    page: { type: string }
                    language: { type: string }
                    userAgent: { type: string }
      responses:
        "201":
          description: Received.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  receivedAt: { type: string, format: date-time }
        "400":
          description: A missing or invalid field.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: INVALID_EMAIL, message: "Enter a valid email address." }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        `Authorization: Bearer <token>`, as returned by `POST /auth/login`
        or any of the subscription-mutating endpoints. See the `Token`
        schema for what it's expected to carry.

  parameters:
    XTimezone:
      name: X-Timezone
      in: header
      description: >-
        The user's IANA time zone (the browser's). "Today", which day an
        occurrence shows on, overdue and due times are all worked out in it.
        Missing or unknown: Europe/Zagreb.
      schema: { type: string, example: Europe/Zagreb }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string }
    SeriesId:
      name: seriesId
      in: path
      required: true
      schema: { type: string }
    OccurrenceDate:
      name: date
      in: path
      required: true
      description: The occurrence's date (`Item.occurrenceDate` -- in the task's own zone, which can differ from the day it shows on).
      schema: { type: string, format: date }
    NoteTimestamp:
      name: timestamp
      in: path
      required: true
      description: A note's `timestamp` -- notes have no ids of their own.
      schema: { type: integer, format: int64 }
    ImportId:
      name: importId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StatsScope:
      name: scope
      in: query
      required: true
      description: "`task:<taskId>`, `series:<seriesId>` or `all` (every task)."
      schema: { type: string, example: "series:abc123" }

  requestBodies:
    NoteText:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [text]
            properties:
              text: { type: string }

  responses:
    Action:
      description: Done -- what changed, for the client to fetch again.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ActionResult" }
    Invalid:
      description: "`VALIDATION_ERROR` -- a missing or malformed field, named in `message`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing/invalid bearer token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`TASK_NOT_FOUND`, `SERIES_NOT_FOUND`, `NOTE_NOT_FOUND`, or no such import."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Refused:
      description: The task's rules don't allow it now -- see the endpoint's own description for the codes.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PlanLimit:
      description: >-
        The free plan's limits: `TASK_LIMIT` (no more tasks of this kind),
        `NOTE_LIMIT` (no more notes on this task), `TASK_LOCKED` (a task
        beyond a lapsed account's limits can't be completed or noted on).
        The client offers a subscription.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyReads:
      description: >-
        Reads (`GET` under `/atodo/v1/`) have their own rate limit, 100 per
        10 seconds by default, separate from the general one -- hitting it
        only answers 429 (plain text), it never counts toward an IP ban.
        `RateLimit-Reset` says when to try again.
      headers:
        RateLimit-Reset: { schema: { type: integer }, description: Seconds until the window resets. }

  schemas:
    EpochMillis:
      type: integer
      format: int64
      description: >-
        Milliseconds since the Unix epoch (`Date.now()`/`new Date(ms)` on the
        client), not an RFC 3339 string -- deliberately, since every one of
        these fields is used in client-side arithmetic/sorting (elapsed
        time, "is this still active", "which of these was created first",
        ...) and epoch millis need no parsing to do that. `dueDate`/
        `endDate`/occurrence-date fields elsewhere are a different thing --
        plain `YYYY-MM-DD` strings with no time component, compared as
        strings, so those stay `format: date`.

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable -- the client branches on this, not `message`.
        message:
          type: string
          description: Human-readable fallback; a finished client should show its own translated copy per `code` instead.

    Token:
      type: string
      description: >-
        Opaque to the client beyond reading its claims (a real
        implementation: a signed JWT). Expected claims: `sub` (the account
        id) and `subscription` (the same shape as `User.subscription`, a
        snapshot as of when the token was issued -- re-issued by every
        endpoint that changes it, see each one's own description). The
        client never trusts a locally decoded token's claims for anything
        but quick, non-authoritative UI reads (e.g. "should the Subscribe
        button show right now") -- `GET /auth/me` is the actual source of
        truth for whether the account/subscription are still genuinely in
        that state.

    Background:
      type: object
      nullable: true
      description: The Settings background picker's currently-applied Unsplash photo, or null for none.
      properties:
        regularUrl: { type: string, format: uri }
        thumbUrl: { type: string, format: uri }
        photographerName: { type: string }
        photographerUrl: { type: string, format: uri }
        photoLink: { type: string, format: uri }

    Subscription:
      type: object
      nullable: true
      description: null means the account has never subscribed (the "Free" plan).
      properties:
        id: { type: string }
        plan:
          type: string
          enum: [trial, pro]
        billingInterval:
          type: string
          enum: [monthly, annual]
          nullable: true
          description: null for a trial.
        startedAt: { $ref: "#/components/schemas/EpochMillis" }
        expiresAt:
          allOf: [{ $ref: "#/components/schemas/EpochMillis" }]
          description: >-
            The single source of truth for whether the subscription is
            currently active -- always `now < expiresAt`, never a separately
            cached boolean, so an expiry is correctly detected the instant
            it passes rather than only once something happens to re-check it.
        cancelAtPeriodEnd:
          type: boolean
          description: True once the subscription won't renew (see POST /subscriptions/cancel and POST /users/me/schedule-deletion) -- access is untouched until expiresAt regardless.
        scheduledDeletion:
          type: boolean
          description: True if the account itself, not just the subscription, is set to be deleted once expiresAt passes -- see POST /users/me/schedule-deletion.

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        pendingEmail:
          type: string
          format: email
          nullable: true
          description: An address a login-email change is waiting to have verified (see POST /users/me/change-email), or null.
        nickname: { type: string }
        avatar:
          type: string
          nullable: true
          description: A data URL, or null for the initials-only fallback avatar.
        timeFormat: { type: string, enum: ["12", "24"] }
        background: { $ref: "#/components/schemas/Background" }
        language:
          type: string
          nullable: true
          description: >-
            A language code from `GET /languages`. null means never chosen
            or IP-detected yet -- the client detects and PATCHes a real
            value the first time this is null right after login. (A deleted
            language turns it back to null.)
        theme:
          type: string
          enum: [dark, light]
          description: Always a real value -- unlike language, there's no auto-detection step; defaults to dark for a brand new account.
        weekStart:
          type: integer
          minimum: 0
          maximum: 6
          nullable: true
          description: First day of the week for calendars and weekday lists, 0=Sunday..6=Saturday. null means never chosen -- the client then follows the language (Sunday for en, Monday for any other).
        todoViewMode:
          type: string
          enum: [pending, next-recurrence, all]
        subscription: { $ref: "#/components/schemas/Subscription" }
        trialAvailable:
          type: boolean
          description: >-
            Whether `POST /subscriptions/trial` would succeed: the account
            has never had any plan (trial or paid) -- counting before it was
            deleted and reopened (see `POST /auth/login`).

    FrequencyOnce:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [once] }

    FrequencyDays:
      type: object
      required: [type, interval]
      properties:
        type: { type: string, enum: [days] }
        interval: { type: integer, minimum: 1 }

    FrequencyWeeks:
      type: object
      required: [type, interval]
      properties:
        type: { type: string, enum: [weeks] }
        interval: { type: integer, minimum: 1 }
        weekdays:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
          description: 0=Sunday..6=Saturday. Omitted/empty falls back to dueDate's own weekday (backward compatibility with older saved tasks).

    FrequencyMonths:
      type: object
      required: [type, interval]
      properties:
        type: { type: string, enum: [months] }
        interval: { type: integer, minimum: 1 }
        dayMode:
          type: string
          enum: [day, last, before-last, weekday, multi-weekday, multi-weekday-offset, multi-day]
          description: Omitted/"day" anchors to dueDate's day-of-month, clamped to shorter months.
        offset:
          type: integer
          minimum: 0
          maximum: 3
          description: dayMode "before-last" only -- days before the last day of the month.
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: dayMode "weekday" only.
        ordinal:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 5
            - type: string
              enum: [last]
          description: dayMode "weekday"/"multi-weekday"/"multi-weekday-offset". "last" only valid for dayMode "weekday".
        weekdays:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
          description: dayMode "multi-weekday"/"multi-weekday-offset" only.
        offsetDirection:
          type: string
          enum: [before, after]
          description: dayMode "multi-weekday-offset" only.
        offsetDays:
          type: integer
          minimum: 0
          maximum: 6
          description: dayMode "multi-weekday-offset" only.
        days:
          type: array
          items: { type: integer, minimum: 1, maximum: 31 }
          description: dayMode "multi-day" only -- exact days of the month.

    Frequency:
      description: >-
        See recurrence.js's own top-of-file comment for the full recurrence
        rules each shape implies. Every shape may also carry two optional
        fields the client uses to keep a task's recorded past separate from
        its current pattern (see Task): `startsOn` (date -- the pattern
        produces nothing before it, while dueDate stays its phase anchor) and
        `skipDates` (date[] -- individual dates the pattern would land on but
        no longer produces, i.e. deleted occurrences). The backend stores the
        object as-is.
      oneOf:
        - $ref: "#/components/schemas/FrequencyOnce"
        - $ref: "#/components/schemas/FrequencyDays"
        - $ref: "#/components/schemas/FrequencyWeeks"
        - $ref: "#/components/schemas/FrequencyMonths"
      discriminator:
        propertyName: type
        mapping:
          once: "#/components/schemas/FrequencyOnce"
          days: "#/components/schemas/FrequencyDays"
          weeks: "#/components/schemas/FrequencyWeeks"
          months: "#/components/schemas/FrequencyMonths"

    Timer:
      type: object
      nullable: true
      description: >-
        Lives on the specific Occurrence being timed (see Occurrence.timer)
        -- which occurrence that is is already implied by the row it's
        attached to, so unlike before this carries no occurrenceDate of its
        own.
      properties:
        mode: { type: string, enum: [countdown, countup] }
        continuePastZero: { type: boolean }
        totalSeconds: { type: integer }
        remainingSeconds:
          type: integer
          description: The checkpointed remaining time as of runningSince (or the frozen value if paused) -- the client derives live remaining time from this plus elapsed wall-clock time, not a stored live countdown.
        runningSince:
          allOf: [{ $ref: "#/components/schemas/EpochMillis" }]
          nullable: true
          description: null while paused/not yet started.

    LogEntry:
      type: object
      properties:
        message:
          type: string
          description: >-
            What happened, in English as the server writes it ("Marked
            done", "Rescheduled to 2026-10-12") -- the log's own record.
        key:
          type: string
          nullable: true
          readOnly: true
          description: >-
            Responses only: the message's translation key (`log.markedDone`,
            in the `app` bundle of `GET /translations`), for showing it in
            the user's language -- older entries' wordings too. null for a
            message it doesn't recognise, shown as written. Ignored in an
            import.
        params:
          type: object
          readOnly: true
          additionalProperties: { type: string }
          description: >-
            Responses only -- the key's placeholders, e.g.
            `{ "date": "2026-10-12" }`.
        timestamp: { $ref: "#/components/schemas/EpochMillis" }
        occurrenceDate:
          type: string
          format: date
          nullable: true
          description: >-
            Task.log only -- which occurrence (if any) triggered this
            whole-pattern-level event, e.g. the split point of a "this and
            following" edit. An Occurrence.log entry has no need for this:
            which occurrence it's about is already implied by the row it's
            attached to.

    Comment:
      type: object
      properties:
        text: { type: string }
        timestamp: { $ref: "#/components/schemas/EpochMillis" }

    OccurrenceOverrides:
      type: object
      nullable: true
      description: >-
        Deprecated -- cleared when older data is imported: a task's data
        applies to all of its occurrences alike. Kept in the schema only so
        older exports still import. Was:
        per-occurrence field overrides for a "this occurrence only" edit --
        any field left out falls back to the owning Task's own value.
      properties:
        name: { type: string }
        description: { type: string }
        details: { type: string }
        dueTime:
          type: string
          nullable: true
          description: "HH:MM, 24-hour. null when allDay."
        allDay: { type: boolean }
        appointment: { type: boolean }
        passive: { type: boolean }

    Occurrence:
      type: object
      description: >-
        One recorded occurrence of a task, as stored and exported (and
        imported). The client doesn't read these directly -- it gets
        `Item`s, `TaskDetail` and the like.
      required: [id, taskId, occurrenceDate, status]
      properties:
        id:
          type: string
          description: This occurrence's own id, server-generated.
        taskId:
          type: string
          description: >-
            The task this occurrence belongs to -- see Task.taskId.
        occurrenceDate:
          type: string
          format: date
          description: >-
            The date this occurrence is/was recorded against. For a
            recurUntilCompleted task, the date it *first* became due (see
            pendingReschedules for how its due date moves while still
            pending). Can change (`POST
            /tasks/{taskId}/occurrences/{date}/reschedule`); unique per
            task.
        pendingReschedules:
          type: array
          items: { type: string, format: date }
          description: >-
            Two unrelated uses, never both meaningful on the same occurrence
            at once. For a recurUntilCompleted occurrence: every date it's
            been auto-pushed to since occurrenceDate without being resolved,
            still-live until the chain is finally resolved (see
            Task.recurUntilCompleted) -- a recurUntilCompleted task keeps at
            most one 'pending' Occurrence alive at a time; completing it
            resolves this row and a new 'pending' Occurrence is created for
            the next cycle. For a plain task's occurrence: every date it's
            been manually rescheduled away from (see occurrenceDate above)
            -- excludes those dates from the client re-treating them as
            fresh, unclaimed pattern-predicted occurrences once this one has
            moved elsewhere.
        status:
          type: string
          enum: [pending, completed, failed]
          description: >-
            This occurrence's OUTCOME -- mutually exclusive. Independent of
            `dismissed` below: an occurrence can be 'completed' and not yet
            dismissed (the brief linger before it visually disappears), or
            still 'pending' and already dismissed (a genuinely missed
            occurrence swept off the list without ever being resolved) --
            these are two separate axes, not one.
        resolvedAt:
          allOf: [{ $ref: "#/components/schemas/EpochMillis" }]
          nullable: true
          description: When `status` left 'pending', or null while still pending.
        dismissed:
          type: boolean
          description: Whether this occurrence is hidden from the list regardless of `status` -- see `status`'s own description.
        manual:
          type: boolean
          description: True for an occurrence added on a date the task's own pattern doesn't otherwise produce -- "add one extra occurrence", or the resume date of a paused recurrence.
        overrides: { $ref: "#/components/schemas/OccurrenceOverrides" }
        details:
          type: string
          nullable: true
          description: Free-text details specific to this one occurrence -- unlike Task.details, which applies to all of a task's occurrences alike.
        comments:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
          description: Notes scoped to this one occurrence -- see the side panel's occurrence/task/series scope toggle, and Task.comments for the task-wide equivalent.
        log:
          type: array
          items: { $ref: "#/components/schemas/LogEntry" }
          description: Occurrence-specific activity (marked done/failed, timer set/cancelled/elapsed, focused/unfocused, ...) -- see Task.log for whole-pattern-level events instead.
        focusedSeconds:
          type: integer
          description: Total focused time logged against this occurrence (see the "Work on this now" focus mode).
        timerSeconds:
          type: integer
          description: Total timer-tracked time logged against this occurrence.
        timer: { $ref: "#/components/schemas/Timer" }

    Task:
      type: object
      description: A task as stored and exported (and imported) -- see `Occurrence`.
      required:
        - id
        - taskId
        - seriesId
        - name
        - dueDate
        - allDay
        - appointment
        - passive
        - recurUntilCompleted
        - frequency
        - createdAt
      properties:
        id:
          type: string
          description: This record's id. One record per task (see taskId).
        taskId:
          type: string
          description: >-
            The task's identity, referenced by each of its Occurrences (see
            Occurrence.taskId). A task is exactly one record: its data (name,
            time, flags, ...), its *current* recurrence pattern (dueDate,
            frequency, endDate, recurUntilCompleted -- there's no history of
            earlier patterns), and its recorded Occurrences, which always
            count as occurrences whatever the current pattern says. When the
            pattern changes, every date the old one produced before today is
            saved as an Occurrence first. Older data could hold several
            records per taskId ("fragments" of a split recurring task); an
            import merges those into one.
        seriesId:
          type: string
          description: Groups otherwise-unrelated tasks a person has manually merged into one series in the Manage Tasks modal -- independent of taskId.
        seriesName:
          type: string
          nullable: true
        name: { type: string }
        description: { type: string }
        details: { type: string }
        dueDate: { type: string, format: date }
        dueTime:
          type: string
          nullable: true
          description: "HH:MM, 24-hour. null when allDay."
        allDay: { type: boolean }
        appointment:
          type: boolean
          description: Past-due becomes permanently "failed" instead of carrying over as overdue.
        passive:
          type: boolean
          description: >-
            A plain reminder: its checkbox means "mark failed" instead of
            complete (see Occurrence.status). A timed one counts as done once
            its due time has passed (derived, not stored) -- after its time
            it's done or failed, before it pending or failed; an all-day one
            carries over until marked failed or dismissed. Never together
            with recurUntilCompleted.
        recurUntilCompleted:
          type: boolean
          description: >-
            See Occurrence.pendingReschedules for the live reschedule chain.
            dueDate below is only ever the date this task was first created
            with -- never updated again once the first Occurrence exists;
            the actual current due date lives on that Occurrence instead.
        endDate:
          type: string
          format: date
          nullable: true
        frequency: { $ref: "#/components/schemas/Frequency" }
        timeZone:
          type: string
          nullable: true
          description: A timed task's fixed zone (see `TaskDetailsInput.timeZone`), or null.
        createdAt:
          allOf: [{ $ref: "#/components/schemas/EpochMillis" }]
          description: When the task was first created (see the free-tier task limits, which grandfather by this field).
        statsResetAt:
          allOf: [{ $ref: "#/components/schemas/EpochMillis" }]
          nullable: true
          description: >-
            When the task's stats were last reset (null = never). Stats count
            the task's occurrences from then on; the task's own history is
            untouched. Set by `POST /stats/reset`.
        log:
          type: array
          items: { $ref: "#/components/schemas/LogEntry" }
          description: Whole-pattern-level activity (creation, whole-task edits, series splits) -- see Occurrence.log for per-occurrence events.
        comments:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
          description: General notes about the task as a whole (added while the side panel is scoped to 'task'/'series', not to one date) -- see Occurrence.comments for per-occurrence notes.

    ReadResult:
      type: object
      properties:
        expiredTimers:
          type: array
          description: >-
            Present when a timer ran out since the account was last read --
            every request first brings the account up to date (expired
            timers stopped and credited, missed occurrences carried over or
            dismissed). The client plays its chime.
          items:
            type: object
            properties:
              taskId: { type: string }
              occurrenceDate: { type: string, format: date }

    ActionResult:
      allOf:
        - $ref: "#/components/schemas/ReadResult"
        - type: object
          required: [changed, active]
          properties:
            changed:
              type: object
              description: What the action changed -- the client fetches those days, the side panel and the agenda again.
              properties:
                taskIds:
                  type: array
                  items: { type: string }
                all: { type: boolean, description: Everything may have changed (an import, say). }
            active:
              type: object
              nullable: true
              description: The focused occurrence after the action, or null.
              properties:
                taskId: { type: string }
                occurrenceDate: { type: string, format: date }

    Item:
      type: object
      description: >-
        One occurrence as a list shows it -- everything a row draws, and
        which actions it allows (the client draws exactly these).
      required: [taskId, occurrenceDate, displayDate, kind, label, actions]
      properties:
        taskId: { type: string, nullable: true, description: null for the subscription reminder. }
        seriesId: { type: string, nullable: true }
        occurrenceDate:
          type: string
          format: date
          description: The occurrence's own date, in the task's zone -- what actions address it by.
        displayDate:
          type: string
          format: date
          description: The user's local day it shows on (differs from occurrenceDate only for a task fixed to another zone).
        kind:
          type: string
          enum: [carried-over, today, tomorrow, upcoming]
        name: { type: string }
        label: { type: string, description: 'The name to show: "series: name" in a mixed series.' }
        description: { type: string }
        allDay: { type: boolean }
        dueTime:
          type: string
          nullable: true
          description: "HH:MM in the user's local time; null when allDay."
        timeZone:
          type: string
          nullable: true
          description: A timed task's fixed zone, or null (its time is local wherever the user is).
        zoneDueTime:
          type: string
          nullable: true
          description: The due time in the task's own zone, when that differs from the user's.
        appointment: { type: boolean }
        passive: { type: boolean }
        recurUntilCompleted: { type: boolean }
        completed: { type: boolean }
        failed: { type: boolean }
        overdue: { type: boolean }
        dismissed: { type: boolean }
        active: { type: boolean, description: This occurrence is the focused one. }
        locked: { type: boolean, description: "Beyond a free/lapsed account's limits: a padlock instead of a checkbox." }
        virtual:
          type: string
          nullable: true
          enum: [subscription-prompt, null]
          description: >-
            `subscription-prompt`: the reminder a free account gets on
            today's list -- no task behind it, no actions; the client words
            it in the user's language.
        timer: { $ref: "#/components/schemas/Timer" }
        actions:
          type: array
          items:
            type: string
            enum: [timer, autoTimer, pauseTimer, resumeTimer, cancelTimer, complete, reopen, fail, unfail, focus, unfocus, dismiss, restore, edit, pause, resume, stats]
        autoTimerSeconds:
          type: integer
          nullable: true
          description: >-
            A recurring task measured at least once: its average measured time
            (focus and timer, over every measured occurrence -- the agenda's
            block length too), which the `autoTimer` action starts a countdown
            of. null otherwise.

    TaskDetailsInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 500 }
        description: { type: string, maxLength: 2000 }
        details: { type: string }
        allDay: { type: boolean }
        dueTime: { type: string, nullable: true, description: "HH:MM; required unless allDay." }
        timeZone:
          type: string
          nullable: true
          description: >-
            An IANA zone the due time is fixed in (the task then occurs on
            its zone's dates and is due at that moment, shown on the user's
            local day), or null for a "fluid" task, due at that local time
            wherever the user is. Always null for an all-day task.
        appointment: { type: boolean }
        passive: { type: boolean }

    PatternInput:
      type: object
      required: [dueDate, frequency]
      properties:
        dueDate: { type: string, format: date }
        frequency:
          allOf: [{ $ref: "#/components/schemas/Frequency" }]
          description: "`startsOn`, `skipDates` and `pause` are the server's own -- ignored if sent."
        endDate: { type: string, format: date, nullable: true, description: Ignored for a one-off. }
        recurUntilCompleted: { type: boolean }

    TaskSummary:
      type: object
      properties:
        taskId: { type: string }
        seriesId: { type: string }
        name: { type: string }
        label: { type: string }
        description: { type: string }
        details: { type: string }
        dueDate: { type: string, format: date }
        dueTime: { type: string, nullable: true }
        allDay: { type: boolean }
        appointment: { type: boolean }
        passive: { type: boolean }
        recurUntilCompleted: { type: boolean }
        endDate: { type: string, format: date, nullable: true }
        frequency: { $ref: "#/components/schemas/Frequency" }
        timeZone: { type: string, nullable: true }
        createdAt: { $ref: "#/components/schemas/EpochMillis" }
        statsResetAt:
          allOf: [{ $ref: "#/components/schemas/EpochMillis" }]
          nullable: true
        locked: { type: boolean }
        paused:
          type: object
          nullable: true
          description: The pause in effect today, if any.
          properties:
            from: { type: string, format: date }
            until: { type: string, format: date }

    TaskDetail:
      type: object
      required: [task, occurrenceList, occurrences, series]
      properties:
        task:
          allOf:
            - $ref: "#/components/schemas/TaskSummary"
            - type: object
              properties:
                comments: { type: array, items: { $ref: "#/components/schemas/Comment" } }
                log: { type: array, items: { $ref: "#/components/schemas/LogEntry" } }
                notesUsed: { type: integer, description: Notes on the task and its occurrences together. }
                canAddNote: { type: boolean }
        occurrenceList:
          type: array
          description: >-
            The editor's Occurrences tab, newest first: every past
            occurrence, the next one (and the one after, if the next is
            already done), every recorded one, and any `extraDate`.
          items:
            type: object
            properties:
              date: { type: string, format: date }
              next: { type: boolean }
              status: { type: string, enum: [pending, missed, upcoming, completed, failed] }
              recorded: { type: boolean, description: Something is recorded on it (it has a row). }
              noteCount: { type: integer }
              deletable: { type: boolean }
              reschedulable: { type: boolean }
        occurrences:
          type: array
          description: Every recorded occurrence, with its own notes and activity.
          items:
            type: object
            properties:
              occurrenceDate: { type: string, format: date }
              status: { type: string, enum: [pending, completed, failed] }
              dismissed: { type: boolean }
              manual: { type: boolean }
              details: { type: string, nullable: true }
              comments: { type: array, items: { $ref: "#/components/schemas/Comment" } }
              log: { type: array, items: { $ref: "#/components/schemas/LogEntry" } }
              focusedSeconds: { type: integer }
              timerSeconds: { type: integer }
        series:
          type: object
          properties:
            seriesId: { type: string }
            name: { type: string }
            mixed: { type: boolean }

    SeriesDetail:
      type: object
      required: [seriesId, name, mixed, tasks]
      properties:
        seriesId: { type: string }
        name: { type: string }
        mixed: { type: boolean }
        tasks:
          type: array
          description: By due date.
          items: { $ref: "#/components/schemas/TaskSummary" }

    Stats:
      type: object
      properties:
        scope: { type: string, enum: [task, series, all] }
        title: { type: string, nullable: true, description: The task's or series' name. }
        since:
          allOf: [{ $ref: "#/components/schemas/EpochMillis" }]
          nullable: true
          description: When every task in scope was reset together, if they were.
        aggregate: { type: boolean, description: A series or all tasks (an overview and time per day). }
        recurring: { type: boolean, description: Completion counts apply. }
        taskCount: { type: integer }
        occurrencesToDate: { type: integer }
        completed: { type: integer }
        completionRate: { type: integer, description: Percent. }
        totalFocusedSeconds: { type: integer }
        totalTimerSeconds: { type: integer }
        perDate:
          type: array
          description: Newest first.
          items:
            type: object
            properties:
              date: { type: string, format: date }
              focusedSeconds: { type: integer }
              timerSeconds: { type: integer }

    Export:
      type: object
      properties:
        version: { type: integer, example: 1 }
        exportedAt: { type: string, format: date-time }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        occurrences:
          type: array
          items: { $ref: "#/components/schemas/Occurrence" }
        userProfile:
          type: object
          description: nickname, avatar, timeFormat, background, language, theme, weekStart.
        activeTaskId: { type: string, nullable: true }
        activeOccurrenceDate: { type: string, format: date, nullable: true }
        todoViewMode: { type: string, enum: [pending, next-recurrence, all] }

    FocusSession:
      type: object
      description: >-
        A session of focus (focused without a timer) or timer time on an
        occurrence, as it ran -- every one is recorded when it ends (focus
        moves elsewhere, the timer is paused, cancelled or runs out); the
        occurrence's totals are what stats read.
      properties:
        id: { type: string, nullable: true, description: "null: not stored yet (still running)" }
        taskId: { type: string }
        occurrenceDate: { type: string, format: date }
        label: { type: string }
        kind: { type: string, enum: [focus, timer] }
        startMs: { $ref: "#/components/schemas/EpochMillis" }
        endMs:
          allOf: [{ $ref: "#/components/schemas/EpochMillis" }]
          nullable: true
          description: null while it's still running.
        appointment: { type: boolean }
        passive: { type: boolean }
