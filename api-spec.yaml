  /maleniti/v1/admin/pos-price-lists/{pos_price_list_id}:
    parameters:
      - name: pos_price_list_id
        in: path
        required: true
        schema: { type: integer }
    put:
      summary: Edit an assignment
      description: Until its publication deadline; same rules as creating one (its own moment may stay).
      operationId: replaceMalenitiPosPriceList
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MalenitiPosPriceList' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MalenitiPosPriceList' }
        "400": { description: Invalid, or a moment past its deadline (plain-text message) }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Not found }
        "409": { description: Past its publication deadline }
    delete:
      summary: Withdraw an assignment
      description: Until its publication deadline.
      operationId: deleteMalenitiPosPriceList
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Withdrawn }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Not found }
        "409": { description: Past its publication deadline }

  /contact:
    post:
      summary: Submit the contact form
      operationId: submitContact
      description: Rate limited more tightly than other public endpoints to deter spam.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactSubmission' }
      responses:
        "201":
          description: Received
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  received_at: { type: string, format: date-time }
        "400": { description: Validation error }
    get:
      summary: List contact form submissions, newest first
      operationId: listContactSubmissions
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContactRecord' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /contact/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      summary: Mark a contact submission as completed (or not)
      operationId: updateContactSubmission
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completed]
              properties:
                completed: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactRecord' }
        "400": { description: 'completed (boolean) is required' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Not found }

  /v1/quotable:
    post:
      summary: Render a quote as a 1920x1080 PNG image
      operationId: renderQuote
      description: >
        Public endpoint — no auth required to render an image. If called
        with a valid Bearer API key (super admin or not), the rendered image
        is additionally saved to disk on the server; unauthenticated calls
        only get the image back in the response, nothing is persisted.
        Rate limited more tightly than other public endpoints due to
        rendering cost.
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote, author]
              properties:
                quote: { type: string, description: 'Multi-line quote text (\n-separated)' }
                author: { type: string, description: 'Multi-line author text (\n-separated)' }
      responses:
        "200":
          description: OK
          content:
            image/png:
              schema: { type: string, format: binary }

  /api-keys/me:
    get:
      summary: Identify the calling API key
      operationId: whoAmI
      description: >
        Returns which key is authenticating the request and whether it's a
        super admin key. Useful for validating a key (e.g. at login) and for
        a client to discover its own id ahead of POST /api-keys/{id}/rotate.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  label: { type: string }
                  is_super_admin: { type: boolean }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api-keys/{id}/rotate:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      summary: Rotate an API key's secret
      operationId: rotateApiKey
      description: >
        Issues a new secret for an existing key, replacing the old one - the
        id, label, and super-admin flag are unchanged, but the old secret
        stops working immediately. Any authenticated caller can rotate their
        own key (id must match the caller's own); a super admin can rotate
        any key. The new plaintext secret is returned once here, same as
        `scripts/create-api-key.js` - it cannot be retrieved again afterwards.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyRotated' }
        "400": { description: Invalid id }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: 'Authenticated, but neither the key''s own owner nor a super admin' }
        "404": { description: Not found }
        "409": { description: API key has been revoked }

  /api-keys/bootstrap:
    post:
      summary: Provision the first admin API key
      operationId: bootstrapAdminApiKey
      description: >
        Public, unauthenticated endpoint for provisioning the very first
        super admin API key on a fresh deployment, since every other
        key-issuing path requires either an existing key or shell access to
        the container. Only ever succeeds once — 404s if an admin key
        already exists. The plaintext key is returned once here and is not
        recoverable afterwards; only its hash is stored.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, default: admin }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  label: { type: string }
                  is_super_admin: { type: boolean }
                  created_at: { type: string, format: date-time }
                  key:
                    type: string
                    description: The new plaintext secret. Shown once, here, and never again.
        "404": { description: An admin API key already exists }

components:
  parameters:
    PriceListBrand:
      name: brand
      in: path
      required: true
      description: The brand's code, e.g. `atodo`.
      schema: { type: string }
    PriceListPointOfSale:
      name: pointOfSale
      in: query
      description: >
        The point of sale's label (oznaka poslovnog prostora), e.g. `WEB1`.
        Default the `FISCAL_PREMISES` this API is configured with.
      schema: { type: string }
    PriceListLanguage:
      name: lang
      in: query
      description: Language of the names and column headers.
      schema: { type: string, enum: [hr, en], default: hr }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        API key issued via `scripts/create-api-key.js` or
        `POST /api-keys/bootstrap`. Required (and must belong to a super
        admin) for all content-management endpoints listed above.

  responses:
    Unauthorized:
      description: Missing or invalid API key
    Forbidden:
      description: Authenticated, but not a super admin

  schemas:
    Service:
      type: object
      required: [tone, roman, num_hr, num_en, title_hr, title_en, title2_hr, title2_en, body_hr, body_en, list_hr, list_en]
      properties:
        id: { type: integer, readOnly: true }
        sort_order: { type: integer, description: 'Manual sort position, ascending. Optional, defaults to 0.' }
        tone: { type: string, enum: [indigo, green] }
        roman: { type: string, example: "I" }
        num_hr: { type: string }
        num_en: { type: string }
        title_hr: { type: string }
        title_en: { type: string }
        title2_hr: { type: string }
        title2_en: { type: string }
        body_hr: { type: string }
        body_en: { type: string }
        list_hr: { type: array, items: { type: string } }
        list_en: { type: array, items: { type: string } }

    PricingPlan:
      type: object
      required: [tag_hr, tag_en, title_hr, title_en, sub_hr, sub_en, list_hr, list_en, when_hr, when_en, featured]
      properties:
        id: { type: integer, readOnly: true }
        sort_order: { type: integer, description: 'Manual sort position, ascending. Optional, defaults to 0.' }
        tag_hr: { type: string }
        tag_en: { type: string }
        title_hr: { type: string }
        title_en: { type: string }
        em_hr: { type: string, description: Substring of title_hr to italicize }
        em_en: { type: string }
        sub_hr: { type: string }
        sub_en: { type: string }
        list_hr: { type: array, items: { type: string } }
        list_en: { type: array, items: { type: string } }
        when_hr: { type: string }
        when_en: { type: string }
        featured: { type: boolean, description: Highlights this plan as the recommended option }

    WorkItem:
      type: object
      description: >
        `featured: true` marks the single detailed case study shown at full
        width; all other items render as minimal placeholder slots
        (media_label + caption only).
      required: [featured, media_label_hr, media_label_en, caption_hr, caption_en]
      properties:
        id: { type: integer, readOnly: true }
        sort_order: { type: integer, description: 'Manual sort position, ascending. Optional, defaults to 0.' }
        featured: { type: boolean }
        slug: { type: string, nullable: true, description: Must be unique if set }
        media_label_hr: { type: string }
        media_label_en: { type: string }
        caption_hr: { type: string }
        caption_en: { type: string }
        status_label_hr: { type: string, nullable: true }
        status_label_en: { type: string, nullable: true }
        title_hr: { type: string, nullable: true }
        title_en: { type: string, nullable: true }
        title_rest_hr: { type: string, nullable: true }
        title_rest_en: { type: string, nullable: true }
        body_hr: { type: string, nullable: true }
        body_en: { type: string, nullable: true }
        chips: { type: array, items: { type: string }, nullable: true }
        client_hr: { type: string, nullable: true }
        client_en: { type: string, nullable: true }
        duration_hr: { type: string, nullable: true }
        duration_en: { type: string, nullable: true }
        users_hr: { type: string, nullable: true }
        users_en: { type: string, nullable: true }
        status_hr: { type: string, nullable: true }
        status_en: { type: string, nullable: true }
        demo_url:
          type: string
          nullable: true
          description: >
            Absolute or site-relative URL of this project's live demo. Each
            demo is a separately designed page built to that project's own
            specification and is NOT part of this frontend — the API is the
            only source for the link. Null hides the demo button entirely.
          example: "https://demo.maleniti.com/iot-pipeline"
        demo_label_hr: { type: string, nullable: true, example: "Pogledaj demo" }
        demo_label_en: { type: string, nullable: true, example: "View the demo" }
        post_slug:
          type: string
          nullable: true
          description: >
            Optional slug of a blog post describing this project's features.
            When set, the work item renders a link to
            blog-post.html?slug={post_slug}. Must match a BlogPost slug.
          example: "sto-je-view-u-iot-sustavu"

    BlogPostSummary:
      type: object
      required: [slug, tag_hr, tag_en, tone, date_hr, date_en, title_hr, title_en, excerpt_hr, excerpt_en, read_hr, read_en]
      properties:
        slug: { type: string, description: Must be unique }
        tag_hr: { type: string }
        tag_en: { type: string }
        tone: { type: string, enum: [indigo, green] }
        date_hr: { type: string }
        date_en: { type: string }
        title_hr: { type: string }
        title_en: { type: string }
        em_hr: { type: string, description: Substring of title_hr to italicize }
        em_en: { type: string }
        excerpt_hr: { type: string }
        excerpt_en: { type: string }
        read_hr: { type: string, example: "5 min čitanja" }
        read_en: { type: string, example: "5 min read" }
        featured:
          type: boolean
          default: false
          description: >
            Marks the lead post shown large at the top of the blog index.
            At most one post should set this; the newest is used otherwise.
        lede_hr: { type: string, nullable: true, description: Standfirst shown on the index lead and post page }
        lede_en: { type: string, nullable: true }

    BlogPost:
      allOf:
        - { $ref: '#/components/schemas/BlogPostSummary' }
        - type: object
          required: [body_hr, body_en]
          properties:
            body_hr:
              type: array
              description: >
                Ordered body blocks. The post page renders each by `type`:
                "p" = paragraph (the first one gets a drop cap),
                "h" = section subheading, "q" = pull quote.
              items: { $ref: '#/components/schemas/BodyBlock' }
            body_en:
              type: array
              items: { $ref: '#/components/schemas/BodyBlock' }

    BodyBlock:
      type: object
      required: [type, text]
      properties:
        type: { type: string, enum: [p, h, q] }
        text: { type: string }

    MalenitiTranslatedText:
      type: object
      description: One text per language (`maleniti.language`); Croatian required.
      additionalProperties: { type: string }
      example: { hr: Internetska prodaja, en: Online sales }
    MalenitiLegalText:
      type: object
      properties:
        title: { type: string }
        body: { type: string, description: HTML }
        changed: { type: boolean, description: This version changed it }
        summary: { type: string }
    MalenitiLanguage:
      type: object
      required: [language_id, name]
      properties:
        language_id: { type: string, example: hr }
        name: { type: string, example: hrvatski }
    MalenitiPointOfSale:
      type: object
      required: [code, type, address]
      properties:
        point_of_sale_id: { type: integer, readOnly: true }
        code: { type: string, example: WEB1, description: oznaka poslovnog prostora }
        type: { $ref: '#/components/schemas/MalenitiTranslatedText' }
        address: { type: string, example: Slakovec 80 }
    MalenitiDevice:
      type: object
      required: [point_of_sale_id, device_number]
      properties:
        device_id: { type: integer, readOnly: true }
        point_of_sale_id: { type: integer }
        point_of_sale_code: { type: string, readOnly: true }
        device_number: { type: integer, example: 1 }
    MalenitiBrand:
      type: object
      required: [code, name]
      properties:
        brand_id: { type: integer, readOnly: true }
        code: { type: string, example: atodo }
        name: { $ref: '#/components/schemas/MalenitiTranslatedText' }
    MalenitiProduct:
      type: object
      required: [brand_id, code, name]
      properties:
        product_id: { type: integer, readOnly: true }
        brand_id: { type: integer }
        brand_code: { type: string, readOnly: true }
        code: { type: string, example: atodo-pro-monthly }
        name: { $ref: '#/components/schemas/MalenitiTranslatedText' }
        featured_ord: { type: integer, nullable: true, description: Its place on the brand's landing page; null = not shown. }
        highlight: { type: boolean, default: false, description: Highlighted on the landing page. }
        billing_interval: { type: string, enum: [month, year], nullable: true, description: A subscription billed every month/year; one per interval per brand. }
        stripe_product_id: { type: string, nullable: true, example: prod_abc123, description: The Stripe Product checkout sells its subscriptions as (test and live mode differ). }
    MalenitiPriceInput:
      type: object
      required: [product_id, price_eur]
      properties:
        product_id: { type: integer }
        price_eur: { type: number, example: 2.0, description: At most two decimals. }
        anchored: { type: boolean, default: false, description: An anchor price (in a later version, a new one - false keeps the current anchor). }
        special_sale: { type: boolean, default: false, description: A price during a special form of sale (posebni oblik prodaje). }
    MalenitiVersionInput:
      type: object
      required: [valid_from, prices]
      properties:
        valid_from: { type: string, format: date-time, description: When these prices take effect. }
        prices: { type: array, minItems: 1, items: { $ref: '#/components/schemas/MalenitiPriceInput' } }
    MalenitiPosPriceList:
      type: object
      required: [point_of_sale_id, price_list_id, valid_from]
      properties:
        pos_price_list_id: { type: integer, readOnly: true }
        point_of_sale_id: { type: integer }
        point_of_sale_code: { type: string, readOnly: true }
        price_list_id: { type: integer }
        valid_from: { type: string, format: date-time }
        until: { type: string, format: date-time, nullable: true, readOnly: true, description: When the point of sale moved on to another list (GET /price-lists only). }
        editable: { type: boolean, readOnly: true }
    MalenitiPriceLists:
      type: object
      properties:
        earliest_valid_from: { type: string, format: date-time }
        price_lists:
          type: array
          items:
            type: object
            properties:
              price_list_id: { type: integer }
              created_at: { type: string, format: date-time }
              used_at: { type: array, items: { $ref: '#/components/schemas/MalenitiPosPriceList' } }
              versions:
                type: array
                description: Newest first.
                items:
                  type: object
                  properties:
                    valid_from: { type: string, format: date-time }
                    base: { type: boolean, description: The list's first version. }
                    editable: { type: boolean }
                    deadline: { type: string, format: date-time, description: 08:00 Europe/Zagreb on the day it takes effect. }
                    prices:
                      type: array
                      items:
                        allOf:
                          - $ref: '#/components/schemas/MalenitiPriceInput'
                          - type: object
                            properties:
                              price_id: { type: integer }
                              product_code: { type: string }
                              changed: { type: boolean, description: Takes effect at this version (else carried over). }
    CurrentPrices:
      type: object
      properties:
        brand: { type: string, example: atodo }
        pointOfSale: { type: string, example: WEB1 }
        products:
          type: array
          items:
            type: object
            properties:
              code: { type: string, example: atodo-pro-monthly }
              name: { type: string }
              price_eur: { type: number, example: 2.2 }
              anchor_eur: { type: number, nullable: true, example: 2.0 }
              special_sale: { type: boolean }
              featured_ord: { type: integer, nullable: true }
              highlight: { type: boolean }
              billing_interval: { type: string, enum: [month, year], nullable: true }
    PriceListVersions:
      type: object
      properties:
        brand: { type: string, example: atodo }
        pointOfSale: { type: string, example: WEB1 }
        priceLists:
          type: array
          description: The price lists the point of sale used during the versions offered, oldest first.
          items:
            type: object
            properties:
              id: { type: integer }
              usedFrom: { type: string, format: date-time, description: When the point of sale switched to it. }
              priceChanges:
                type: array
                description: The versions offered while it was in use — when each began, oldest first.
                items: { type: string, format: date-time }
    ImprintInfo:
      type: object
      description: >
        Fields are plain (untranslated) except where the value is genuinely
        language-dependent (legal form, VAT status, register name), which
        follow the usual `_hr`/`_en` convention.
      required: [legal_name, legal_form_hr, legal_form_en, owner_name, address, oib, registration_number, register_hr, register_en, vat_status_hr, vat_status_en, bank_name, iban, swift, hosting_provider]
      properties:
        legal_name: { type: string, description: Full registered business name }
        legal_form_hr: { type: string, example: "obrt" }
        legal_form_en: { type: string, example: "sole trader" }
        owner_name: { type: string }
        address: { type: string, description: Registered/business address }
        oib: { type: string, description: Croatian personal/business tax number }
        registration_number: { type: string, description: MBS or trade register number }
        register_hr: { type: string, example: "Trgovački sud u Zagrebu" }
        register_en: { type: string, example: "Commercial Court in Zagreb" }
        vat_status_hr: { type: string, example: "nije u sustavu PDV-a" }
        vat_status_en: { type: string, example: "not VAT registered" }
        phone: { type: string, nullable: true }
        bank_name: { type: string }
        iban: { type: string }
        swift: { type: string }
        hosting_provider: { type: string, description: Server provider and/or data centre location }

    ContactSubmission:
      type: object
      required: [name, email, msg]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        kind: { type: string, description: Selected project type, free text }
        msg: { type: string }

    ContactRecord:
      allOf:
        - { $ref: '#/components/schemas/ContactSubmission' }
        - type: object
          properties:
            id: { type: string, format: uuid, readOnly: true }
            completed: { type: boolean }
            received_at: { type: string, format: date-time, readOnly: true }
            source:
              type: string
              enum: [maleniti, atodo]
              readOnly: true
              description: The website's own form, or A-To-Do's support page (POST /atodo/v1/support).
            atodo_account_id: { type: string, format: uuid, nullable: true, readOnly: true, description: The A-To-Do account that sent it, if logged in. }
            atodo_account_email: { type: string, nullable: true, readOnly: true }
            context:
              type: object
              nullable: true
              readOnly: true
              description: What A-To-Do's client reported about itself (appVersion, page, language, userAgent).

    ApiKeyRotated:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        label: { type: string }
        is_super_admin: { type: boolean }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        key:
          type: string
          description: >
            The new plaintext secret. Shown once, here, and never again -
            only its hash is stored. Use it as the Bearer token from now on;
            the previous secret stops working immediately.
