openapi: 3.0.3
info:
  title: Male Niti Content API
  description: >
    Backs the dynamic content on maleniti.com — services, pricing plans,
    blog posts, portfolio/work items, and contact form submissions.
    Public GET endpoints are cached client-side with a static fallback
    baked into the frontend (hi-fi/content.jsx) if unreachable.
    Text fields are bilingual: every user-facing string has a `_hr` and
    `_en` sibling (Croatian / English) rather than nested locale objects,
    to match the frontend's existing data shape.
    Content-management endpoints (anything that isn't a plain public `GET`,
    `POST /contact`, or `POST /api-keys/bootstrap`) require a super admin
    Bearer API key issued via `scripts/create-api-key.js` or
    `POST /api-keys/bootstrap`; unauthenticated or non-admin calls get `401`
    or `403`.
  version: "1.0.0"
servers:
  - url: https://maleniti.com/api
    description: Production (self-hosted, same origin)

security:
  - {}

paths:
  /services:
    get:
      summary: List the three service offerings
      operationId: listServices
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Service' }
    post:
      summary: Create a service offering
      operationId: createService
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Service' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Service' }
        "400": { description: Missing required field(s) }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /services/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    put:
      summary: Replace a service offering
      operationId: replaceService
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Service' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Service' }
        "400": { description: Missing required field(s) }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Not found }
    patch:
      summary: Partially update a service offering
      operationId: updateService
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Service' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Service' }
        "400": { description: No updatable fields provided }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Not found }
    delete:
      summary: Delete a service offering
      operationId: deleteService
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Not found }

  /pricing:
    get:
      summary: List engagement/pricing plans
      operationId: listPricing
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PricingPlan' }
    post:
      summary: Create a pricing plan
      operationId: createPricingPlan
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PricingPlan' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingPlan' }
        "400": { description: Missing required field(s) }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /pricing/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    put:
      summary: Replace a pricing plan
      operationId: replacePricingPlan
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PricingPlan' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingPlan' }
        "400": { description: Missing required field(s) }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Not found }
    patch:
      summary: Partially update a pricing plan
      operationId: updatePricingPlan
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PricingPlan' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingPlan' }
        "400": { description: No updatable fields provided }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Not found }
    delete:
      summary: Delete a pricing plan
      operationId: deletePricingPlan
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Not found }

  /work:
    get:
      summary: List portfolio/work items (one may be featured)
      operationId: listWork
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkItem' }
    post:
      summary: Create a work item
      operationId: createWorkItem
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkItem' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItem' }
        "400": { description: Missing required field(s) }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { description: 'Duplicate slug' }

  /work/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    put:
      summary: Replace a work item
      operationId: replaceWorkItem
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkItem' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItem' }
        "400": { description: Missing required field(s) }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Not found }
        "409": { description: 'Duplicate slug' }
    patch:
      summary: Partially update a work item
      operationId: updateWorkItem
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkItem' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItem' }
        "400": { description: No updatable fields provided }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Not found }
        "409": { description: 'Duplicate slug' }
    delete:
      summary: Delete a work item
      operationId: deleteWorkItem
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Not found }

  /blog:
    get:
      summary: List blog post summaries, newest first
      operationId: listBlogPosts
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BlogPostSummary' }
    post:
      summary: Create a blog post
      operationId: createBlogPost
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlogPost' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlogPost' }
        "400": { description: Missing required field(s) }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { description: 'Duplicate slug' }

  /blog/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Full blog post body, for a future dedicated post page
      operationId: getBlogPost
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlogPost' }
        "404": { description: Not found }
    put:
      summary: Replace a blog post
      operationId: replaceBlogPost
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlogPost' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlogPost' }
        "400": { description: Missing required field(s) }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Not found }
        "409": { description: 'Duplicate slug (if renaming via body.slug)' }
    patch:
      summary: Partially update a blog post
      operationId: updateBlogPost
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlogPost' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlogPost' }
        "400": { description: No updatable fields provided }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Not found }
        "409": { description: 'Duplicate slug (if renaming via body.slug)' }
    delete:
      summary: Delete a blog post
      operationId: deleteBlogPost
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Not found }

  /imprint:
    get:
      summary: Business/registration details for the imprint page
      description: >
        Single object, not a list — there is exactly one imprint. Keeps the
        legally-required registration details (OIB, court/trade register,
        bank details, etc.) out of the frontend bundle so they can be
        corrected without a redeploy.
      operationId: getImprint
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImprintInfo' }
        "404": { description: Imprint not set yet }
    post:
      summary: Create the imprint (first-time setup)
      operationId: createImprint
      description: >
        Only ever succeeds once, since there is exactly one imprint — 409s
        if it already exists. Use PATCH to correct it afterwards.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImprintInfo' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImprintInfo' }
        "400": { description: Missing required field(s) }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { description: Imprint already exists - use PATCH to update it }
    patch:
      summary: Update the imprint
      operationId: updateImprint
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImprintInfo' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImprintInfo' }
        "400": { description: No updatable fields provided }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Imprint not set yet - use POST to create it }

  /feed.xml:
    # Overrides the global /api server: every page links this as a plain
    # root-relative "feed.xml" (RSS convention — readers expect it beside
    # the site, not nested under an API path), so it must be routed at the
    # domain root rather than under /api like every other path here.
    servers:
      - url: https://maleniti.com
        description: Site root (not under /api — see the routing note above)
    get:
      summary: RSS 2.0 feed of the blog
      description: >
        Served by the backend (not the static frontend) so the feed stays in
        step with /blog. Linked from the footer and declared for autodiscovery
        in every page head. Built from the same records /blog returns:
        <title> from title_hr/en, <description> from lede_hr/en or
        excerpt_hr/en, <link> as https://maleniti.com/blog-post.html?slug={slug},
        <guid isPermaLink="false"> as the slug, <pubDate> in RFC-822.
        Serve an English feed via ?lang=en.
      operationId: getFeed
      parameters:
        - name: lang
          in: query
          schema: { type: string, enum: [hr, en], default: hr }
      responses:
        "200":
          description: OK
          content:
            application/rss+xml:
              schema: { type: string }

  /maleniti/v1/price-lists/{brand}:
    get:
      summary: A brand's price list at a point of sale, as CSV
      description: >
        The machine-readable price list Croatian law requires a
        consumer-facing website to publish (Odluka o objavi cjenika, NN
        101/2026), as it stood at `at`: the price list that point of sale
        used then (its latest assignment up to `at`), one row per product of
        the brand with a price in it by then — its name, its latest price up
        to `at`, whether that price applies during a special form of sale,
        and its anchor price (the latest anchored price up to `at` among the
        lists that point of sale has used; Odluka o isticanju dodatne
        cijene). RFC 4180 CSV:
        comma-separated, decimal points (`2.00`), a header row, UTF-8 with a
        BOM, CRLF lines. Rebuilt from the price
        history (the `maleniti` schema) on every request, so any earlier
        version is the same request with an earlier `at` — see
        /versions. The `Content-Disposition` file name carries what the
        decision asks for: point-of-sale type, address and label, a storage
        number (the price list's id) and the
        Zagreb-local date and time the version took effect, e.g.
        `Internetska prodaja_Slakovec 80_WEB1_1_2026-09-10T00-00.csv`.
        Public; CORS open to any origin.
      operationId: getPriceList
      parameters:
        - $ref: '#/components/parameters/PriceListBrand'
        - $ref: '#/components/parameters/PriceListPointOfSale'
        - name: at
          in: query
          description: The moment the list is wanted for (ISO 8601). Default now.
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/PriceListLanguage'
      responses:
        "200":
          description: OK
          content:
            text/csv:
              schema: { type: string }
        "400": { description: "`VALIDATION_ERROR` — a malformed `at`, an unknown `lang`, or no point of sale given or configured" }
        "404": { description: "`NOT_FOUND` — no such brand or point of sale" }

  /maleniti/v1/price-lists/{brand}/current:
    get:
      summary: A brand's products and prices right now, as JSON
      description: >
        For the brand's website — every price A-To-Do's client shows comes
        from here, the same prices the CSV lists and checkout charges: each
        product with a price at the point of sale now, its anchor price, and
        how the landing page shows it (`featured_ord`: its place, null = not
        shown; `highlight`). Public; CORS open to any origin.
      operationId: getCurrentPrices
      parameters:
        - $ref: '#/components/parameters/PriceListBrand'
        - $ref: '#/components/parameters/PriceListPointOfSale'
        - $ref: '#/components/parameters/PriceListLanguage'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentPrices' }
        "400": { description: "`VALIDATION_ERROR` — an unknown `lang`, or no point of sale given or configured" }
        "404": { description: "`NOT_FOUND` — no such brand or point of sale" }

  /maleniti/v1/price-lists/{brand}/versions:
    get:
      summary: The price list versions still to be offered
      description: >
        Every moment the point of sale's price list changed — it switched to
        another list, or a price of the brand changed in the list it uses —
        starts a version, valid until the next one. A version is offered
        until 30 days after it was replaced (each replaced version must stay
        available that long), the current one always; moments still in the
        future aren't versions yet. Grouped by price list, oldest first.
        GET /maleniti/v1/price-lists/{brand}?at=<moment> downloads one.
        Public; CORS open to any origin.
      operationId: getPriceListVersions
      parameters:
        - $ref: '#/components/parameters/PriceListBrand'
        - $ref: '#/components/parameters/PriceListPointOfSale'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceListVersions' }
        "400": { description: "`VALIDATION_ERROR` — no point of sale given or configured" }
        "404": { description: "`NOT_FOUND` — no such brand or point of sale" }

  /maleniti/v1/admin/languages:
    get:
      summary: List languages
      operationId: listMalenitiLanguages
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MalenitiLanguage' } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create one of the languages
      description: >
        The code (`language_id`, two letters) is given here and can't be changed afterwards. With `copy_from`, the
        new language starts with a copy of that language's every text (A-To-Do's interface texts and the business
        data's alike), to be translated in place; without, every text falls back to English until translated. A
        new language is offered to A-To-Do's users at once (`GET /atodo/v1/languages`).
      operationId: createMalenitiLanguage
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MalenitiLanguage'
                - type: object
                  properties:
                    copy_from: { type: string, nullable: true, example: en, description: The language whose texts to copy. }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MalenitiLanguage' }
        "400": { description: A missing or invalid field (plain-text message) }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { description: A duplicate, or a reference to something that does not exist }
  /maleniti/v1/admin/languages/{language_id}:
    parameters:
      - name: language_id
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Replace one of the languages
      operationId: replaceMalenitiLanguage
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MalenitiLanguage' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MalenitiLanguage' }
        "400": { description: A missing or invalid field (plain-text message) }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Not found }
        "409": { description: A duplicate, or a reference to something that does not exist }
    delete:
      summary: Delete one of the languages
      description: >
        Takes every text in it along; A-To-Do accounts that used it go back to choosing a language. English (the
        fallback for any missing text) and Croatian (the price lists' language) can't be deleted.
      operationId: deleteMalenitiLanguage
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted (with its translated texts) }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Not found }
        "409": { description: English or Croatian (plain-text message) }

  /maleniti/v1/admin/translations:
    get:
      summary: List a brand client's interface texts
      description: >
        Every named translation key of the brand (migration 010: A-To-Do's interface texts, which its client fetches
        from `GET /atodo/v1/translations`) with its text in each language, and the languages -- the admin app's
        Translations tab. A language a text is missing from shows English in the client.
      operationId: listMalenitiTranslations
      security: [{ bearerAuth: [] }]
      parameters:
        - name: brand
          in: query
          schema: { type: string, default: atodo }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  languages: { type: array, items: { $ref: '#/components/schemas/MalenitiLanguage' } }
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        trid: { type: integer }
                        bundle: { type: string, example: app, description: "Which part of the client loads it: common, app, or a page (landing, faq, ...)" }
                        name: { type: string, example: todo.addTask }
                        texts: { type: object, additionalProperties: { type: string }, example: { en: + Add task, hr: + Dodaj zadatak } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: No such brand }
  /maleniti/v1/admin/translations/import:
    post:
      summary: Import one language's interface texts
      description: >
        The admin app's "Import translations", reading a file its "Export translations" made. Every text in `texts` is
        set; the brand's texts the file doesn't have are left as they are; keys the brand has no text for are skipped
        and listed in `unknown` (texts are added with the client code that uses them). A language that doesn't exist
        yet is created (`language.name` required then), with no other texts. One transaction; up to 2 MB.
      operationId: importMalenitiTranslations
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language, texts]
              properties:
                brand: { type: string, default: atodo }
                language:
                  type: object
                  required: [language_id]
                  properties:
                    language_id: { type: string, example: hr }
                    name: { type: string, example: hrvatski }
                texts: { type: object, additionalProperties: { type: string }, example: { todo.addTask: + Dodaj zadatak } }
      responses:
        "200":
          description: Imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  language_id: { type: string }
                  created_language: { type: boolean }
                  updated: { type: integer, description: Texts set (changed or new) }
                  unchanged: { type: integer }
                  unknown: { type: array, items: { type: string }, description: Keys skipped }
        "400": { description: An invalid field (plain-text message) }
