  /maleniti/v1/admin/price-lists:
    get:
      summary: Every price list with its versions and where it's used
      description: >
        A price list's products are the ones it has prices for; it keeps
        every price it ever held, a change being a new price at the moment it
        takes effect. Each such moment is a version: the whole list as it
        stands then (`changed` marks the prices taking effect at it), newest
        first. `editable` — still before its publication deadline: a change
        has to be published by 08:00 Europe/Zagreb on the day it takes
        effect, and can be edited until then. `earliest_valid_from` is the
        earliest moment a new change can take effect now.
      operationId: listMalenitiPriceLists
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MalenitiPriceLists' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a price list
      description: >
        Its first prices take effect at `valid_from`, which must be in the
        future and before its publication deadline; the list is used from
        then on at `point_of_sale_ids`, if given (or assigned later, see
        /pos-price-lists).
      operationId: createMalenitiPriceList
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MalenitiVersionInput'
                - type: object
                  properties:
                    point_of_sale_ids: { type: array, items: { type: integer } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { type: object, properties: { price_list_id: { type: integer } } }
        "400": { description: A missing or invalid field, or a moment past its deadline (plain-text message) }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
  /maleniti/v1/admin/price-lists/{price_list_id}/versions:
    parameters:
      - name: price_list_id
        in: path
        required: true
        schema: { type: integer }
    post:
      summary: Add a version ("copy")
      description: >
        New prices for the list's products from `valid_from` on (after its
        latest version; in the future and before its publication deadline).
        `prices` must name exactly the list's products — adding or removing
        products means a new list. Only prices that change something become
        new rows: a different amount or special-sale flag, or `anchored` (a
        new anchor price; leaving it false keeps the current anchor).
      operationId: addMalenitiPriceListVersion
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MalenitiVersionInput' }
      responses:
        "204": { description: Added }
        "400": { description: Invalid, nothing changed, or a moment past its deadline (plain-text message) }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Not found }
  /maleniti/v1/admin/price-lists/{price_list_id}/versions/{at}:
    parameters:
      - name: price_list_id
        in: path
        required: true
        schema: { type: integer }
      - name: at
        in: path
        required: true
        description: The version's current valid_from.
        schema: { type: string, format: date-time }
    put:
      summary: Edit a version
      description: >
        Until its publication deadline (409 after): its moment (kept, or
        moved to another still-publishable one between the versions around
        it) and prices, with the same rules as adding one. Prices keep their
        price_id; ones that no longer change anything are dropped. A list's
        only version may also change its products.
      operationId: editMalenitiPriceListVersion
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MalenitiVersionInput' }
      responses:
        "204": { description: Saved }
        "400": { description: Invalid, nothing changed, or a moment past its deadline (plain-text message) }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: No such list or version }
        "409": { description: Past its publication deadline }
    delete:
      summary: Withdraw a version
      description: >
        Until its publication deadline. A list's only version takes the list
        with it, and its assignments to points of sale (which must still be
        before their deadlines too); a first version with later ones can't
        be withdrawn.
      operationId: withdrawMalenitiPriceListVersion
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Withdrawn }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: No such list or version }
        "409": { description: Past its publication deadline, or a first version with later ones }
  /maleniti/v1/admin/pos-price-lists:
    get:
      summary: Which point of sale uses which price list from when
      description: A point of sale uses its latest assigned list up to any moment. `editable` as for versions.
      operationId: listMalenitiPosPriceLists
